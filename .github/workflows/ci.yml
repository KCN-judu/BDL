name: CI

# One validation contract: every job runs a profile of scripts/preflight.py,
# the same checks a developer runs locally (`python scripts/preflight.py
# full` before a push).  What each job proves, and why Windows runs the
# subset it runs, is docs/project/ci.md.

on:
  push:
    branches: [main]
  pull_request:

# A newer commit on a branch or PR supersedes the run in flight; main keeps
# every run, so its history stays complete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust + docs (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      # Caches the registry, git deps and the dependency artifacts under
      # target/ (workspace crates are rebuilt); sets CARGO_INCREMENTAL=0.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # rust-format, docs-format, docs-lint, docs-validate, ci-scripts,
      # screenshots, l10n, rust-clippy, rust-test — cheap checks first
      - run: python3 scripts/preflight.py rust-ci
      - name: Upload bdld for the Flutter job
        uses: actions/upload-artifact@v4
        with:
          name: bdld-linux
          path: target/debug/bdld

  flutter:
    name: Flutter (Linux)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: bdld-linux
          path: ${{ github.workspace }}/target/debug
      - run: chmod +x ${{ github.workspace }}/target/debug/bdld
      # flutter-deps, dart-format, flutter-analyze, studio-l10n-generated,
      # flutter-test (every Studio test, against the Linux bdld)
      - run: python3 scripts/preflight.py flutter-ci
        env:
          BDLD_PATH: ${{ github.workspace }}/target/debug/bdld

  proto:
    name: Protocol (generated Dart up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-protoc@v3
        with:
          version: "25.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate protoc_plugin
      - run: |
          export PATH="$PATH:$HOME/.pub-cache/bin"
          python3 scripts/preflight.py proto-ci

  # Windows proves what Linux cannot: paths, drive letters, file URIs,
  # process spawning, the filesystem, the host toolchain and the native
  # build.  Three jobs in parallel instead of one serial job; the Rust
  # compatibility set builds bdld.exe once for the Studio tests.
  windows-rust:
    name: Windows compatibility (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      # The workspace crates are cached too: on Windows their compile is the
      # whole cost of the job (2 m 11 s of 2 m 55 s on the first run), and
      # cargo only rebuilds the crates whose sources changed.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      # windows-rust: the crates whose tests meet paths, URIs, processes,
      # files or the host cargo (scripts/preflight.py WINDOWS_RUST_CRATES)
      - run: python scripts/preflight.py windows-rust-ci
      - name: Upload bdld.exe for the Studio job
        uses: actions/upload-artifact@v4
        with:
          name: bdld-windows
          path: target/debug/bdld.exe

  # The Flutter SDK on Windows: restoring the stock 1.8 GB cache costs about
  # a minute per job, almost all of it extracting 23 000 files.  The SDK is
  # cached slim instead — scripts/slim_flutter_sdk.py removes the Android
  # and web artifacts and the framework's dev/example/engine trees on the
  # run that installs it (a cache miss), and every later run restores the
  # smaller archive.  The pub cache stays: its 42 MB restore (19–24 s) beats
  # a cold `flutter pub get` on Windows (38–55 s).  Measured in
  # docs/project/ci.md.
  windows-studio:
    name: Windows compatibility (Studio)
    runs-on: windows-latest
    needs: windows-rust
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
          cache-key: "flutter-slim-:os:-:channel:-:version:-:arch:-:hash:"
      - name: Slim the Flutter SDK before it is cached
        if: steps.flutter.outputs.CACHE-HIT != 'true'
        run: python scripts/slim_flutter_sdk.py
      - uses: actions/download-artifact@v4
        with:
          name: bdld-windows
          path: ${{ github.workspace }}\target\debug
      # windows-flutter: the Studio tests tagged `daemon || filesystem`
      # (apps/studio/dart_test.yaml) against bdld.exe
      - run: python scripts/preflight.py windows-flutter-ci
        env:
          BDLD_PATH: ${{ github.workspace }}\target\debug\bdld.exe

  windows-build:
    name: Windows native build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        id: flutter
        with:
          channel: stable
          flutter-version: "3.47.4"
          cache: true
          cache-key: "flutter-slim-:os:-:channel:-:version:-:arch:-:hash:"
      - name: Slim the Flutter SDK before it is cached
        if: steps.flutter.outputs.CACHE-HIT != 'true'
        run: python scripts/slim_flutter_sdk.py
      # windows-build: `flutter build windows --debug` — the cheapest
      # command that proves the native target compiles and links
      - run: python scripts/preflight.py windows-build-ci
