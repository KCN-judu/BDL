name: bdl_studio
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  file_selector: ^1.1.0
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  path: ^1.9.1
  protobuf: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Chakra Petch (SIL OFL 1.1, assets/fonts/ChakraPetch-OFL.txt): the
    # square, 45°-chamfered display face used for the Studio wordmark only.
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-Regular.ttf
        - asset: assets/fonts/ChakraPetch-Medium.ttf
          weight: 500
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700
