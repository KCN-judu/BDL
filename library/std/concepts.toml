# BDL Standard Library — reusable authoring fragments built from ordinary
# BDL structures (docs/spec/concept-library.md).
#
# [[template]] — a Concept item: instantiating it produces one
# CreateConcept edit with these defaults and a fresh SemanticId.
# [[source]] — a Source item: a PRESET for creating a Source — a value
# entering the behavior model from the environment, `<source> : () -> C`
# with no definition — over a concept the designer chooses: an existing
# concept of the design, or a new one created in the same transaction.
# `value` describes the new concept the preset suggests (name, value form,
# unit) and `relationship` the Source it suggests (name); Studio's Source
# sheet prefills them and ranks existing concepts by the value form.  The
# item owns no identity.  (The legacy `InstantiateLibraryItem` request
# still creates both objects at once from the same data.)  Nothing here
# is a sensor primitive, an I/O operation, a kernel type, a device or a
# global identity; a project never depends on this file after the objects
# exist.  Display names and descriptions are the canonical English;
# Studio localizes them by id.
#
# representation: { quantity = "<quantity id>" } — from the shared quantity
# vocabulary (bdl_model::quantity), "boolean", "count", or "open" (decide
# later).  unit: a symbol from the shared unit table (bdl-elab), shown as
# the default; the dimension is the quantity's, never the unit's.
# role_hint: input | output | either — authoring/discovery only.

[library]
id = "std"
name = "BDL Standard Library"
schema_version = 2
version = "0.2"

# ---- environment ----------------------------------------------------------

[[template]]
id = "std.environment.temperature"
display_name = "Temperature"
default_name = "Temperature"
description = "How warm something is: the air, a room, a motor."
category = "environment"
role_hint = "input"
representation = { quantity = "temperature" }
unit = "K"
keywords = ["temp", "thermal", "heat", "warm", "cold", "K", "°C", "celsius"]
icon = "temperature"

