# ---- sources --------------------------------------------------------------
#
# A Source template creates TWO ordinary items: a concept, and a relationship
# `<source> : () -> <concept>` with no definition — a value entering the
# behavior model from the environment, observed once per activation.  The
# canvas shows it as a Source because of that shape and state (ADR-0032), not
# because of anything in this file; a third-party library gets the same.
# Not every Source is a physical sensor — the last two are not — which is why
# the category is "sources".  What realizes a Source (an I2C sensor, an ADC
# channel, a GPIO input) is deployment's, never the template's.

[[template]]
id = "std.source.temperature"
display_name = "Temperature Sensor"
default_name = "RoomTemp"
description = "The temperature of a room, a surface or the air, as the environment provides it."
category = "sources"
role_hint = "input"
representation = { quantity = "temperature" }
unit = "K"
keywords = ["temp", "thermal", "sensor", "thermometer", "°C", "celsius", "source"]
icon = "temperature"
source = { default_name = "TempSensor" }
i18n = { "zh-Hans" = { display_name = "温度传感器", description = "房间、表面或空气的温度，由环境提供。" }, ja = { display_name = "温度センサー", description = "部屋・表面・空気の温度。環境から与えられる値。" } }

[[template]]
id = "std.source.tilt"
display_name = "Tilt Sensor"
default_name = "Tilt"
description = "How far the product leans from level, as the environment provides it."
category = "sources"
role_hint = "input"
representation = { quantity = "angle" }
unit = "deg"
keywords = ["tilt", "lean", "incline", "pitch", "roll", "accelerometer", "imu", "source"]
icon = "tilt"
source = { default_name = "TiltSensor" }
i18n = { "zh-Hans" = { display_name = "倾斜传感器", description = "产品偏离水平的程度，由环境提供。" }, ja = { display_name = "傾きセンサー", description = "製品が水平からどれだけ傾いているか。環境から与えられる値。" } }

[[template]]
