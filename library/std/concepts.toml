# ---- sources ----------------------------------------------------------------
#
# A Source is a value entering the behavior model from the environment,
# observed once per activation: `<name> : () -> C`, no definition.  Which
# concept `C` it provides is the designer's choice, never this file's — an
# existing concept of the design (RoomTemperature, MotorTemperature: two
# identities of one value form stay two choices) or a new one created in
# the same transaction.  Each item below is a preset for that choice: the
# words on the row, a suggested Source name, and the new concept it would
# suggest (name, value form, unit); existing concepts of that value form
# are listed first.  The canvas shows the result as a Source because of its
# shape and state (ADR-0032), not because of anything here.  An input is
# not a sensor — External Input is a host or network value — and what
# realizes it (an I2C sensor, an ADC channel, a GPIO pin; FV Phase 13) is
# deployment's, never the item's.  Display text is the canonical English;
# Studio localizes by id (locale/library/std.json).

[[source]]
id = "std.source.temperature"
display_name = "Temperature Input"
description = "A temperature the environment provides — a room, a surface, the air — read once per activation."
category = "environment"
keywords = ["temp", "thermal", "thermometer", "thermistor", "K", "°C", "celsius", "sensor", "input", "source"]
icon = "temperature"
[source.value]
default_name = "Temperature"
description = "How warm something is."
representation = { quantity = "temperature" }
unit = "K"
[source.relationship]
default_name = "temperatureInput"
description = "Provides the temperature, one reading per activation."

[[source]]
id = "std.source.tilt"
display_name = "Tilt Input"
description = "How far the product leans from level, as the environment provides it — a lamp head, a handheld, a vehicle body."
category = "motion"
keywords = ["tilt", "lean", "incline", "pitch", "roll", "accelerometer", "imu", "level", "sensor", "input", "source"]
icon = "tilt"
[source.value]
default_name = "Tilt"
description = "How far something leans from level."
representation = { quantity = "angle" }
unit = "deg"
[source.relationship]
default_name = "tiltInput"
description = "Provides the tilt, one reading per activation."

[[source]]
id = "std.source.distance"
display_name = "Distance Input"
description = "How far away the nearest thing is, as the environment provides it — an obstacle, a hand, a fill level. Which sensor measures it is a deployment choice."
category = "motion"
keywords = ["range", "proximity", "far", "near", "obstacle", "ultrasonic", "lidar", "tof", "sensor", "input", "source"]
icon = "distance"
[source.value]
default_name = "Distance"
description = "How far away something is."
representation = { quantity = "length" }
unit = "m"
[source.relationship]
default_name = "distanceInput"
description = "Provides the distance, one reading per activation."

[[source]]
id = "std.source.ambient_light"
display_name = "Ambient Light Input"
description = "How much light falls on the product, as the environment provides it — for dimming, waking a display, daylight detection."
category = "environment"
keywords = ["light", "lux", "daylight", "dark", "photocell", "photodiode", "sensor", "input", "source"]
icon = "light"
[source.value]
default_name = "AmbientLight"
description = "The illuminance of the surroundings."
representation = { quantity = "illuminance" }
unit = "lx"
[source.relationship]
default_name = "ambientLightInput"
description = "Provides the ambient light level, one reading per activation."

[[source]]
id = "std.source.button"
display_name = "Button Input"
description = "Whether a button is held or a switch is on right now, as the environment provides it each activation — a stable state, never an event."
category = "human"
keywords = ["button", "switch", "press", "push", "key", "held", "input", "source"]
icon = "button"
[source.value]
default_name = "ButtonHeld"
description = "Whether the button is being held down."
representation = "boolean"
[source.relationship]
default_name = "buttonInput"
description = "Provides the button's state, one reading per activation."

[[source]]
id = "std.source.encoder"
display_name = "Encoder Input"
description = "The angle a shaft or knob has turned to, as the environment provides it. Counting pulses is the deployment's job."
category = "human"
keywords = ["encoder", "rotary", "knob", "shaft", "position", "angle", "quadrature", "input", "source"]
icon = "dial"
[source.value]
default_name = "ShaftAngle"
description = "The angle the shaft or knob has turned to."
representation = { quantity = "angle" }
unit = "deg"
[source.relationship]
default_name = "encoderInput"
description = "Provides the encoder's position, one reading per activation."

[[source]]
id = "std.source.analog"
display_name = "Analog Input"
description = "A generic analog reading the behavior interprets. The value's kind is left to you: choose a value form for the concept once you know what the input measures."
category = "electrical"
keywords = ["analog", "adc", "voltage", "reading", "generic", "input", "source"]
icon = "electrical"
[source.value]
default_name = "AnalogValue"
description = "What the analog input measures — decide the value form."
representation = "open"
[source.relationship]
default_name = "analogInput"
description = "Provides the analog reading, one per activation."

[[source]]
id = "std.source.external"
display_name = "External Input"
description = "A value provided from outside the product — by a host, over a network, by a simulation — as the behavior reads it. An input is not always a sensor."
category = "external"
keywords = ["host", "network", "remote", "simulation", "external", "provided", "input", "source"]
icon = "external"
[source.value]
default_name = "ExternalValue"
description = "The value the environment provides — decide its value form."
representation = "open"
[source.relationship]
default_name = "externalInput"
description = "Provides the external value, one per activation."
