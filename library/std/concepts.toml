# BDL Standard Concept Library — shared authoring vocabulary.
#
# Every entry is a TEMPLATE for creating an ordinary Concept: instantiating
# it produces a CreateConcept edit with these defaults and a fresh
# SemanticId.  Two instantiations are two distinct concepts.  Nothing here
# is a kernel type, a device, or a global identity; a project never depends
# on this file after the concept exists (docs/spec/concept-library.md).
#
# representation: { quantity = "<quantity id>" } — from the shared quantity
# vocabulary (bdl_model::quantity), "boolean", "count", or "open" (decide
# later).  unit: a symbol from the shared unit table (bdl-elab), shown as
# the default; the dimension is the quantity's, never the unit's.
# role_hint: input | output | either — authoring/discovery only.

[library]
id = "std"
name = "BDL Standard Concept Library"
schema_version = 1
version = "0.1"

# ---- environment ----------------------------------------------------------

[[template]]
id = "std.environment.temperature"
display_name = "Temperature"
default_name = "Temperature"
description = "How warm something is: the air, a room, a motor."
category = "environment"
role_hint = "input"
representation = { quantity = "temperature" }
unit = "K"
keywords = ["temp", "thermal", "heat", "warm", "cold", "K", "°C", "celsius"]
icon = "temperature"

[[template]]
id = "std.environment.ambient_light"
display_name = "Ambient Light"
default_name = "AmbientLight"
description = "How much light falls on the product from its surroundings."
category = "environment"
role_hint = "input"
representation = { quantity = "illuminance" }
unit = "lx"
keywords = ["light", "lux", "brightness", "daylight", "dark", "photocell"]
icon = "light"

[[template]]
id = "std.environment.humidity"
display_name = "Humidity"
default_name = "Humidity"
description = "Relative humidity of the air, 0 (dry) to 1 (saturated)."
category = "environment"
role_hint = "input"
representation = { quantity = "scalar" }
keywords = ["moisture", "damp", "rh", "relative humidity", "%"]
icon = "humidity"

[[template]]
id = "std.environment.air_pressure"
display_name = "Air Pressure"
default_name = "AirPressure"
description = "Atmospheric pressure; falls with altitude, moves with weather."
category = "environment"
role_hint = "input"
representation = { quantity = "pressure" }
unit = "Pa"
keywords = ["barometer", "atmospheric", "altitude", "weather", "hPa", "kPa"]
icon = "pressure"

[[template]]
id = "std.environment.sound_level"
display_name = "Sound Level"
default_name = "SoundLevel"
description = "How loud the surroundings are, as a level from 0 (silence) to 1."
category = "environment"
role_hint = "input"
representation = { quantity = "scalar" }
keywords = ["noise", "loud", "microphone", "audio", "dB", "volume"]
icon = "sound"

