# BDL Standard Library — the value categories a concept is created from
# (docs/spec/concept-library.md).
#
# A [[template]] is a Concept item: a *value category* — a value form
# (on / off, count, a level, decide later) or a named physical quantity of
# the shared vocabulary (bdl_model::quantity) — and never a product-specific
# concept.  The Library provides the category; the project provides the
# semantic identity and its name: choosing *Angle* asks for a name
# (`LidAngle`) before anything is created, and the concept it makes is an
# ordinary `CreateConcept` with that name and the category's representation
# (Studio's concept sheet, ADR-0041).  `default_name` is the name the legacy
# path (`InstantiateLibraryItem` without a chosen name) and the textual
# completion (`concept Ang…` → `Angle : Angle`) fall back to; a client that
# asks for a name never uses it.
#
# The units a quantity is measured in are the compiler's (the unit registry,
# served with the vocabulary as `QuantityView.units`); a concept stores its
# dimension and no unit, so `unit` here is the symbol a row shows, nothing
# more — and it is left empty where the registry has no symbol for the
# dimension yet (a composite such as rad/s), so the row shows the
# vocabulary's own display symbol.
#
# `keywords` are the search synonyms in English: what a designer types when
# looking for the category — old product names (tilt, servo, encoder), the
# units, the dimension's words.  Localized names, descriptions and tags live
# in locale/library/std.json (presentation only, ADR-0031).
#
# Nothing here is a kernel type, a device or a global identity; a project
# never depends on this file after the objects exist.  There is no Source
# item: a Source is created on the Source sheet over a concept the designer
# chooses (existing, or new — from these same categories).

[library]
id = "std"
name = "BDL Standard Library"
schema_version = 2
version = "0.3"

# ---- value forms ------------------------------------------------------------

[[template]]
id = "std.value.boolean"
display_name = "On / off"
default_name = "Switch"
description = "A value that is either true or false: on or off, pressed or not, present or absent."
category = "form"
role_hint = "either"
representation = "boolean"
keywords = ["bool", "boolean", "true", "false", "flag", "toggle", "switch", "button", "pressed", "held", "touch", "contact", "state"]
icon = "switch"

[[template]]
id = "std.value.count"
display_name = "Count"
default_name = "Count"
description = "A whole number of things: pulses, presses, items, steps."
category = "form"
role_hint = "either"
representation = "count"
keywords = ["count", "integer", "number of", "pulses", "presses", "items", "steps", "tally"]
icon = "count"

[[template]]
id = "std.value.level"
display_name = "Level"
default_name = "Level"
description = "A plain number with no unit: a level from 0 to 1, a ratio, a factor, a percentage."
category = "form"
role_hint = "either"
representation = { quantity = "scalar" }
keywords = ["scalar", "ratio", "factor", "percent", "%", "fraction", "dimensionless", "brightness", "volume", "humidity", "battery", "speed setting", "intensity", "opening", "dimmer", "fan", "heater", "power setting"]
icon = "level"

[[template]]
id = "std.value.open"
display_name = "Decide later"
default_name = "Value"
description = "A concept whose value form is not chosen yet; relationships can already use it, and the form is decided once known."
category = "form"
role_hint = "either"
representation = "open"
keywords = ["open", "unknown", "later", "undecided", "analog", "external", "raw", "host", "network"]
icon = "open"

# ---- physical quantities ----------------------------------------------------
# One per named quantity of the shared vocabulary (bdl_model::quantity),
# in its order: the base dimensions, then the derived ones.

