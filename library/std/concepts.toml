# ---- sources ----------------------------------------------------------------
#
# A Source item creates TWO ordinary objects in one transaction: a concept
# (`value`) and a relationship `<relationship> : () -> <value>` with no
# definition — a value entering the behavior model from the environment,
# observed once per activation.  The canvas shows it as a Source because of
# that shape and state (ADR-0032), not because of anything in this file; a
# third-party library gets the same.  Not every Source is a physical sensor
# — External Value is a host or network value — which is why the category is
# "source".  What realizes a Source (an I2C sensor, an ADC channel, a GPIO
# input) is deployment's, never the item's.  Display text here is the
# canonical English; Studio localizes by id (locale/library/std.json).

[[source]]
id = "std.source.temperature"
display_name = "Temperature Sensor"
description = "The temperature of a room, a surface or the air, as the environment provides it."
category = "environment"
keywords = ["temp", "thermal", "thermometer", "thermistor", "K", "°C", "celsius", "sensor", "source"]
icon = "temperature"
[source.value]
default_name = "RoomTemp"
description = "The measured temperature."
representation = { quantity = "temperature" }
unit = "K"
[source.relationship]
default_name = "TempSensor"
description = "Supplies the measured temperature, one reading per activation."

[[source]]
id = "std.source.tilt"
display_name = "Tilt Sensor"
description = "How far the product leans from level, as the environment provides it — a lamp head, a handheld, a vehicle body."
category = "motion"
keywords = ["tilt", "lean", "incline", "pitch", "roll", "accelerometer", "imu", "level", "sensor", "source"]
icon = "tilt"
[source.value]
default_name = "Tilt"
description = "How far something leans from level."
representation = { quantity = "angle" }
unit = "deg"
[source.relationship]
default_name = "TiltSensor"
description = "Supplies the tilt, one reading per activation."

[[source]]
id = "std.source.distance"
display_name = "Distance Sensor"
description = "How far away the nearest thing is, as the environment provides it — an obstacle, a hand, a fill level. Which sensor measures it is a deployment choice."
category = "motion"
keywords = ["range", "proximity", "far", "near", "obstacle", "ultrasonic", "lidar", "tof", "sensor", "source"]
icon = "distance"
[source.value]
default_name = "Distance"
description = "How far away something is."
representation = { quantity = "length" }
unit = "m"
[source.relationship]
default_name = "DistanceSensor"
description = "Supplies the measured distance, one reading per activation."

[[source]]
id = "std.source.ambient_light"
display_name = "Ambient Light Sensor"
description = "How much light falls on the product, as the environment provides it — for dimming, waking a display, daylight detection."
category = "environment"
keywords = ["light", "lux", "daylight", "dark", "photocell", "photodiode", "sensor", "source"]
icon = "light"
[source.value]
default_name = "AmbientLight"
description = "The illuminance of the surroundings."
representation = { quantity = "illuminance" }
unit = "lx"
[source.relationship]
default_name = "LightSensor"
description = "Supplies the ambient light level, one reading per activation."

[[source]]
id = "std.source.button"
display_name = "Button State"
description = "Whether a button is held or a switch is on right now, as the environment provides it each activation — a stable state, never an event."
category = "human"
keywords = ["button", "switch", "press", "push", "key", "held", "input", "source"]
icon = "button"
[source.value]
default_name = "ButtonHeld"
description = "Whether the button is being held down."
representation = "boolean"
[source.relationship]
default_name = "ButtonInput"
description = "Supplies the button's state, one reading per activation."

[[source]]
id = "std.source.encoder"
display_name = "Encoder Position"
description = "The angle a shaft or knob has turned to, as the environment provides it. Counting pulses is the deployment's job."
category = "human"
keywords = ["encoder", "rotary", "knob", "shaft", "position", "angle", "quadrature", "input", "source"]
icon = "dial"
[source.value]
default_name = "ShaftAngle"
description = "The angle the shaft or knob has turned to."
representation = { quantity = "angle" }
unit = "deg"
[source.relationship]
default_name = "EncoderPosition"
description = "Supplies the encoder's position, one reading per activation."

[[source]]
id = "std.source.analog"
display_name = "Analog Input"
description = "A generic analog reading the behavior interprets. The value's kind is left to you: choose a quantity for the concept once you know what the input measures."
category = "electrical"
keywords = ["analog", "adc", "voltage", "reading", "generic", "input", "source"]
icon = "electrical"
[source.value]
default_name = "AnalogValue"
description = "What the analog input measures — decide the value form."
representation = "open"
[source.relationship]
default_name = "AnalogInput"
description = "Supplies the analog reading, one per activation."

[[source]]
id = "std.source.external"
display_name = "External Value"
description = "A value provided from outside the product — by a host, over a network, by a simulation — as the behavior reads it. A source is not always a sensor."
category = "external"
keywords = ["host", "network", "remote", "simulation", "external", "provided", "input", "source"]
icon = "external"
[source.value]
default_name = "ExternalValue"
description = "The value the environment provides — decide its value form."
representation = "open"
[source.relationship]
default_name = "ExternalSource"
description = "Supplies the external value, one per activation."
