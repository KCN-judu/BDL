category = "quantity"
role_hint = "either"
representation = { quantity = "angle" }
unit = "rad"
keywords = ["angle", "rotation", "turn", "tilt", "orientation", "heading", "dial", "servo", "encoder", "shaft", "lid", "rad", "deg", "degrees", "radians", "°"]
icon = "angle"

