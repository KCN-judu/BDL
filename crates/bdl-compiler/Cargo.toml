[package]
name = "bdl-compiler"
description = "The pipeline driver: analyze(snapshot) → revision-tagged, deterministic ProjectAnalysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bdl-model = { workspace = true }
bdl-ir = { workspace = true }
bdl-diagnostics = { workspace = true }
bdl-elab = { workspace = true }
bdl-check = { workspace = true }
bdl-reactive = { workspace = true }
bdl-output = { workspace = true }
bdl-hardware = { workspace = true }
bdl-exec-ir = { workspace = true }
bdl-lower = { workspace = true }
bdl-codegen-rust = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
bdl-runtime-host = { workspace = true }
bdl-runtime-embassy = { workspace = true }
# turns the runtime's `collections` feature on for the workspace test build so
# its list tests run under `cargo test --workspace`
bdl-runtime-core = { workspace = true, features = ["collections"] }
bdl-equations = { workspace = true }
# the examples test migrates the legacy form it writes (a dev-only cycle)
bdl-text = { path = "../bdl-text" }
proptest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
