// BDL Studio <-> bdld protocol, version 0.27.
//
// Transport-independent.  Messages are exchanged as length-prefixed frames
// (see crates/bdl-protocol/src/framing.rs); the transport is a child-process
// stdio pair in v0.1.
//
// Rules:
//   * every request carries a client-chosen `request_id`; the daemon answers
//     with exactly one Response bearing the same id;
//   * events are unsolicited and carry the project revision they describe;
//   * the client MUST discard any response/event whose revision is older
//     than the revision it already holds;
//   * Flutter never derives semantic truth from these messages — it renders
//     the projection the daemon sends.
//
// Field numbers are append-only.  Breaking changes bump `PROTOCOL_VERSION`.

syntax = "proto3";

package bdl.v1;

// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

message ClientMessage {
  uint64 request_id = 1;
  oneof payload {
    HandshakeRequest handshake = 10;
    OpenProjectRequest open_project = 11;
    InitProjectRequest init_project = 12;
    SaveProjectRequest save_project = 13;
    CloseProjectRequest close_project = 14;
    GetProjectRequest get_project = 15;
    ApplyEditRequest apply_edit = 16;
    UndoRequest undo = 17;
    RedoRequest redo = 18;
    SetLayoutRequest set_layout = 19;
    SubscribeProjectRequest subscribe_project = 20;
    ShutdownRequest shutdown = 21;
    RunAnalysisRequest run_analysis = 22;
    StartSimulationRequest start_simulation = 23;
    StepSimulationRequest step_simulation = 24;
    ResetSimulationRequest reset_simulation = 25;
    ListTargetsRequest list_targets = 26;
    AnalyzeDeploymentRequest analyze_deployment = 27;
    AnalyzeDefinitionDraftRequest analyze_definition_draft = 28;
    DiscardDefinitionDraftRequest discard_definition_draft = 29;
    CompleteDefinitionDraftRequest complete_definition_draft = 30;
    HoverDefinitionDraftRequest hover_definition_draft = 31;
    HoverEntityRequest hover_entity = 32;
    ListSemanticActionsRequest list_semantic_actions = 33;
    // The Formula Composer (0.12): a structured view of a formula, what a
    // slot expects and fits, and the text edit a structured action makes.
    GetFormulaProjectionRequest get_formula_projection = 34;
    GetFormulaSlotRequest get_formula_slot = 35;
    ComposeFormulaRequest compose_formula = 36;
    ListConceptTemplatesRequest list_concept_templates = 40;
    InstantiateConceptTemplateRequest instantiate_concept_template = 41;
    // The Standard Library as items (0.17): concepts and sources alike.
    ListLibraryItemsRequest list_library_items = 42;
    InstantiateLibraryItemRequest instantiate_library_item = 43;
    // Source creation over a chosen concept (0.23).
    CreateSourceRequest create_source = 44;
    ListSourceCandidatesRequest list_source_candidates = 45;
    // Behaviour systems (protocol 0.6).
    InitSystemProjectRequest init_system_project = 50;
    GetSystemRequest get_system = 51;
    ApplySystemEditRequest apply_system_edit = 52;
    RunSystemAnalysisRequest run_system_analysis = 53;
    // Behaviour grouping and component authoring (protocol 0.8).
    ApplyGroupEditRequest apply_group_edit = 54;
    PreviewComponentExtractionRequest preview_component_extraction = 55;
    // Text projects (ADR-0020; 0.9).
    InitTextProjectRequest init_text_project = 60;
    ReloadProjectRequest reload_project = 61;
    // One project, Code view (ADR-0023; 0.10).
    GetSourcesRequest get_sources = 62;
    ApplySourceEditRequest apply_source_edit = 63;
    // Semantic tokens over a text as typed (0.21): the one classifier's
    // answer for the Code view and the formula editor alike.
    SemanticTokensRequest semantic_tokens = 64;
    // The Code view's IDE queries over a text as typed (0.22): the same
    // overlay as SemanticTokens, the same bdl-ide answers as the language
    // server.
    SourceCompletionRequest source_completion = 65;
    SourceHoverRequest source_hover = 66;
    SourceDefinitionRequest source_definition = 67;
    SourceReferencesRequest source_references = 68;
    FormatSourceRequest format_source = 69;
    // Firmware (0.26): build the chosen target's firmware, its status and
    // artifact, the devices a flash can reach, the flash itself; the demo
    // templates a new project can start from.
    BuildFirmwareRequest build_firmware = 70;
    GetBuildStatusRequest get_build_status = 71;
    CancelBuildRequest cancel_build = 72;
    ListFlashDevicesRequest list_flash_devices = 73;
    FlashFirmwareRequest flash_firmware = 74;
    ListTemplatesRequest list_templates = 75;
    // 0.27: the authoring vocabulary and the Formula view's structure
    ListValueCategoriesRequest list_value_categories = 76;
    NavigateFormulaRequest navigate_formula = 77;
    CompleteFormulaCaretRequest complete_formula_caret = 78;
    GetFormulaSignatureRequest get_formula_signature = 79;
    GetFormulaRenderRequest get_formula_render = 80;
    // 0.29: whole-graph arrangement, the layout service's other command.
    ArrangeLayoutRequest arrange_layout = 81;
  }
}

message ServerMessage {
  oneof payload {
    Response response = 1;
    Event event = 2;
  }
}

message Response {
  uint64 request_id = 1;
  oneof payload {
    Error error = 2;
    HandshakeResponse handshake = 10;
    ProjectResponse project = 11;
    EditApplied edit_applied = 12;
    Ack ack = 13;
    AnalysisResponse analysis = 14;
    SimulationResponse simulation = 15;
    TargetsResponse targets = 16;
    DeploymentResponse deployment = 17;
    DefinitionDraftAnalysis definition_draft = 18;
    DraftCompletionResponse draft_completion = 19;
    DraftHoverResponse draft_hover = 20;
    SemanticActionsResponse semantic_actions = 21;
    ConceptTemplatesResponse concept_templates = 30;
    SystemResponse system = 40;
    SystemEditApplied system_edit_applied = 41;
    SystemAnalysisResponse system_analysis = 42;
    ExtractionPreviewResponse extraction_preview = 43;
    SourcesResponse sources = 44;
    SourceEditApplied source_edit_applied = 45;
    FormulaProjectionResponse formula_projection = 46;
    FormulaSlotResponse formula_slot = 47;
    ComposeFormulaResponse compose_formula = 48;
    LibraryItemsResponse library_items = 49;
    SemanticTokensResponse semantic_tokens = 50;
    SourceCompletionResponse source_completion = 51;
    SourceLocationsResponse source_locations = 52;
    FormatSourceResponse format_source = 53;
    SourceCandidatesResponse source_candidates = 54;
    BuildStatusResponse build_status = 55;
    FlashDevicesResponse flash_devices = 56;
    TemplatesResponse templates = 57;
    ValueCategoriesResponse value_categories = 58;
    NavigateFormulaResponse navigate_formula = 59;
    FormulaSignatureResponse formula_signature = 60;
    FormulaRenderResponse formula_render = 61;
    LayoutResponse layout = 62;
  }
}

message Event {
  oneof payload {
    ProjectChanged project_changed = 1;
    DaemonLog log = 2;
    // Pushed to subscribers after every committed revision, following the
    // ProjectChanged event for the same revision.
    AnalysisReady analysis_ready = 3;
    // A running build's or flash's stages as they happen (0.26); the last
    // one carries the outcome.
    BuildProgress build_progress = 4;
    FlashProgress flash_progress = 5;
  }
}

message Ack {}

// A structured failure of one request.  `code` is a stable machine-readable
// identifier (e.g. "edit.duplicate_concept_name"); `message` is designer
// readable; `details_json` carries the typed error for the expert view.
message Error {
  string code = 1;
  string message = 2;
  string details_json = 3;
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message HandshakeRequest {
  Version client_protocol_version = 1;
  string client_name = 2;
  string client_version = 3;
}

message HandshakeResponse {
  Version protocol_version = 1;
  string compiler_version = 2;
  string daemon_name = 3;
  // True when the daemon accepts the client's protocol version.
  bool compatible = 4;
}

// ---------------------------------------------------------------------------
// Project lifecycle
// ---------------------------------------------------------------------------

message OpenProjectRequest {
  string root_path = 1;
}

message InitProjectRequest {
  string root_path = 1;
  string name = 2;
  // A template id from `ListTemplates` (0.26): the project starts with
  // that design instead of an empty source.  Absent: an empty project.
  optional string template = 3;
}

message SaveProjectRequest {
  // A text project refuses to save over sources that changed on disk since
  // they were loaded (`project.changed_on_disk`); `force` overwrites them.
  bool force = 1;
}

message CloseProjectRequest {}

message GetProjectRequest {}

message SubscribeProjectRequest {}

message ShutdownRequest {}

message ProjectResponse {
  ProjectProjection project = 1;
}

// ---------------------------------------------------------------------------
// Edits
// ---------------------------------------------------------------------------

message ApplyEditRequest {
  // Revision the client believes it is editing.  The daemon refuses the edit
  // if the project has moved on (code "edit.stale_revision").
  uint64 base_revision = 1;
  EditOp op = 2;
}

message UndoRequest {}
message RedoRequest {}

message EditApplied {
  ProjectProjection project = 1;
  EditOutcome outcome = 2;
}

message EditOp {
  oneof op {
    CreateConcept create_concept = 1;
    RenameConcept rename_concept = 2;
    SetConceptDescription set_concept_description = 3;
    SetConceptRepresentation set_concept_representation = 4;
    DeleteConcept delete_concept = 5;
    CreateMapping create_mapping = 6;
    RenameMapping rename_mapping = 7;
    SetMappingDescription set_mapping_description = 8;
    SetMappingSignature set_mapping_signature = 9;
    AttachDefinition attach_definition = 10;
    ReplaceDefinition replace_definition = 11;
    DeleteMapping delete_mapping = 12;
    CreateClockDomain create_clock_domain = 13;
    RenameClockDomain rename_clock_domain = 14;
    DeleteClockDomain delete_clock_domain = 15;
    SetMappingClock set_mapping_clock = 16;
    CreateOutput create_output = 17;
    RenameOutput rename_output = 18;
    SetOutputAccepts set_output_accepts = 19;
    SetOutputClock set_output_clock = 20;
    SetOutputRequired set_output_required = 21;
    DeleteOutput delete_output = 22;
    SetMappingDrive set_mapping_drive = 23;
    CreateDevice create_device = 24;
    RenameDevice rename_device = 25;
    SetDeviceKind set_device_kind = 26;
    SetDeviceOutput set_device_output = 27;
    SetDevicePin set_device_pin = 28;
    DeleteDevice delete_device = 29;
    SetConceptOrdered set_concept_ordered = 30;
    SetDeviceRealization set_device_realization = 31;
    SetDeviceSource set_device_source = 32;
    SetDeviceProvider set_device_provider = 33;
  }
}

message CreateConcept {
  string name = 1;
  string description = 2;
  optional Representation representation = 3;
}
message RenameConcept {
  uint64 id = 1;
  string name = 2;
}
message SetConceptDescription {
  uint64 id = 1;
  string description = 2;
}
message SetConceptRepresentation {
  uint64 id = 1;
  optional Representation representation = 2;
}
// Declare (or undeclare) a concept ordered: its values may then be compared
// with `<`, `min`, `max`, `clamp`, `inRange` through the quantity that
// represents them.  Never inferred from the representation (0.11).
message SetConceptOrdered {
  uint64 id = 1;
  bool ordered = 2;
}
message DeleteConcept {
  uint64 id = 1;
}
message CreateMapping {
  string name = 1;
  string description = 2;
  Signature signature = 3;
  // Defined in the same step (0.19); absent, the mapping is declared only.
  optional Definition definition = 4;
  // The timing domain it updates in; absent, agnostic.
  optional uint64 clock_id = 5;
}
message RenameMapping {
  uint64 id = 1;
  string name = 2;
}
message SetMappingDescription {
  uint64 id = 1;
  string description = 2;
}
message SetMappingSignature {
  uint64 id = 1;
  Signature signature = 2;
}
message AttachDefinition {
  uint64 id = 1;
  Definition definition = 2;
}
message ReplaceDefinition {
  uint64 id = 1;
  // Absent = detach.
  optional Definition definition = 2;
}
message DeleteMapping {
  uint64 id = 1;
}
message CreateClockDomain {
  string name = 1;
}
message RenameClockDomain {
  uint64 id = 1;
  string name = 2;
}
// Refused while a mapping or an output is in the domain.
message DeleteClockDomain {
  uint64 id = 1;
}
message SetMappingClock {
  uint64 id = 1;
  optional uint64 clock_id = 2;
}
message CreateOutput {
  string name = 1;
  string description = 2;
  // The concept the sink accepts.
  uint64 accepts = 3;
  optional uint64 clock_id = 4;
}
message RenameOutput {
  uint64 id = 1;
  string name = 2;
}
message SetOutputAccepts {
  uint64 id = 1;
  uint64 accepts = 2;
}
message SetOutputClock {
  uint64 id = 1;
  optional uint64 clock_id = 2;
}
message SetOutputRequired {
  uint64 id = 1;
  bool required = 2;
}
// Refused while a mapping drives the sink or a device realises it.
message DeleteOutput {
  uint64 id = 1;
}
// Connect (or disconnect) a mapping to the output it commits to.
message SetMappingDrive {
  uint64 id = 1;
  optional uint64 output_id = 2;
}
message CreateDevice {
  string name = 1;
  DeviceKind kind = 2;
  optional uint64 output_id = 3;
}
message RenameDevice {
  uint64 id = 1;
  string name = 2;
}
message SetDeviceKind {
  uint64 id = 1;
  DeviceKind kind = 2;
}
message SetDeviceOutput {
  uint64 id = 1;
  optional uint64 output_id = 2;
}
// Pin one of the device's requirements (by its index in the kind's list)
// to a named board resource, or release it.
message SetDevicePin {
  uint64 id = 1;
  uint32 index = 2;
  optional string resource = 3;
}
message DeleteDevice {
  uint64 id = 1;
}
// Choose how the device realises its output (0.24): a realization profile
// from the registry (docs/architecture/output-realization.md), or none.
// The profile's hardware requirement template becomes the device kind in
// the same edit, so the two never disagree; manual pin choices are kept
// when the kind stays the same.
message SetDeviceRealization {
  uint64 id = 1;
  optional string profile_id = 2;
  DeviceKind kind = 3;
}
// Bind the device to the Source it provides (0.25), by the relationship's
// stable id, or release it.  A deployment assignment: the Source keeps its
// declaration and its meaning.  The device's output is released with it —
// a device consumes or provides, never both.
message SetDeviceSource {
  uint64 id = 1;
  optional uint64 source_id = 2;
}
// Choose how the device provides its Source (0.25): a provider profile
// from the catalogue, or none.  Like SetDeviceRealization, the profile's
// requirement template becomes the device kind in the same edit.
message SetDeviceProvider {
  uint64 id = 1;
  optional string profile_id = 2;
  DeviceKind kind = 3;
}

// What a device binding needs from the board is derived from its kind
// (docs/spec/hardware-model.md); the kind is the whole of what the surface says.
enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_PWM_CHANNEL = 1;
  DEVICE_KIND_DIGITAL_OUTPUT = 2;
  DEVICE_KIND_H_BRIDGE_CHANNEL = 3;
  DEVICE_KIND_I2C_SENSOR = 4;
  DEVICE_KIND_QUADRATURE_ENCODER = 5;
  DEVICE_KIND_UART = 6;
  // One digital input line (0.25).
  DEVICE_KIND_DIGITAL_INPUT = 7;
}

enum EditKind {
  EDIT_KIND_UNSPECIFIED = 0;
  EDIT_KIND_REFINEMENT = 1;
  EDIT_KIND_EDIT = 2;
}

enum Invalidation {
  INVALIDATION_UNSPECIFIED = 0;
  INVALIDATION_INTERFACE = 1;
  INVALIDATION_REALIZATION = 2;
  INVALIDATION_SEMANTIC = 3;
  INVALIDATION_REACTIVE = 4;
  INVALIDATION_CLOCK = 5;
  INVALIDATION_OUTPUT = 6;
  INVALIDATION_DEPLOYMENT = 7;
}

message EditOutcome {
  EditKind kind = 1;
  repeated Invalidation invalidates = 2;
  repeated uint64 origin_decls = 3;
  optional uint64 created_concept = 4;
  optional uint64 created_mapping = 5;
  optional uint64 created_clock = 6;
  optional uint64 created_output = 7;
  optional uint64 created_device = 8;
}

// ---------------------------------------------------------------------------
// Project projection (read model for rendering)
// ---------------------------------------------------------------------------

message ProjectProjection {
  uint64 revision = 1;
  string name = 2;
  string root_path = 3;
  repeated ConceptView concepts = 4;
  repeated MappingView mappings = 5;
  Layout layout = 6;
  bool can_undo = 7;
  bool can_redo = 8;
  bool dirty = 9;
  repeated ClockView clocks = 10;
  repeated OutputView outputs = 11;
  repeated DeviceView devices = 12;
  // Whether this projection is an authored flat design or the derived
  // flattening of a behaviour system (edit the system, not this).
  ProjectKind kind = 13;
}

enum ProjectKind {
  PROJECT_KIND_UNSPECIFIED = 0;
  PROJECT_KIND_FLAT = 1;
  PROJECT_KIND_SYSTEM = 2;
  // `src/**/*.bdl` is the canonical source (ADR-0020); to Studio it is a
  // system project whose sources are written on save.
  PROJECT_KIND_TEXT = 3;
}

message ClockView {
  uint64 id = 1;
  string name = 2;
}

message OutputView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  uint64 accepts = 4;
  optional uint64 clock_id = 5;
  bool required = 6;
}

message DeviceView {
  uint64 id = 1;
  string name = 2;
  DeviceKind kind = 3;
  optional uint64 output_id = 4;
  // Manual pin choices by requirement index.
  repeated DevicePin fixed_pins = 5;
  // The requirements this kind implies, for the editor's pin table.
  repeated RequirementLabel requirements = 6;
  // The realization profile chosen for the output (0.24); absent when the
  // device only places by kind and no raw command is lowered.
  optional string realization = 7;
  // The Source this device provides (0.25), by relationship id; exclusive
  // with output_id.
  optional uint64 source_id = 8;
  // The provider profile chosen for the Source (0.25).
  optional string provider = 9;
}

message DevicePin {
  uint32 index = 1;
  string resource = 2;
}

message RequirementLabel {
  uint32 index = 1;
  // Capability name, e.g. "pwm", "digital_out", "i2c_sda".
  string capability = 2;
  string label = 3;
}

message ConceptView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  optional Representation representation = 4;
  // The designer declared the concept ordered (0.11).
  bool ordered = 5;
}

message MappingView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  Signature signature = 4;
  optional Definition definition = 5;
  AcceptanceState state = 6;
  optional uint64 clock_id = 7;
  optional uint64 drives_output_id = 8;
  // The derived role (ADR-0032; protocol 0.20): what this relationship is
  // to a designer, stated by the daemon from the authored shape and
  // realization state at this revision — never persisted, never authored,
  // never an identity.  A client presents it and never re-derives it; the
  // states a client also shows (declared, invalid, applied by nothing,
  // driven, bound) vary within a role and are separate facts.
  RelationshipRole role = 9;
}

// One of three, derived from two facts (`bdl_model::RelationshipRole`).
// FV Phase 12: `Source Δ d` is "no realization"; a realized `() -> B`
// never consults the environment (`resolved_not_source`).
enum RelationshipRole {
  RELATIONSHIP_ROLE_UNSPECIFIED = 0;
  // Unit domain, no realization: a value provided from outside this design
  // — the environment, or, in a component body, the port it backs.  A
  // simulation input; observed once per activation.
  RELATIONSHIP_ROLE_SOURCE = 1;
  // A domain with inputs: a function from what it reads to what it
  // produces, with or without a definition.  No value of its own at a
  // tick; a value's formula applies it.
  RELATIONSHIP_ROLE_RULE = 2;
  // Unit domain with a realization — a formula, a binding's reference,
  // memory, a constant: a value at every activation of its domain.
  RELATIONSHIP_ROLE_VALUE = 3;
}

// The workspace states of the paper's interaction model.  Only the first two
// are produced before the checker exists; the rest are reserved.
enum AcceptanceState {
  ACCEPTANCE_STATE_UNSPECIFIED = 0;
  ACCEPTANCE_STATE_DECLARED = 1;
  ACCEPTANCE_STATE_DEFINED = 2;
  ACCEPTANCE_STATE_TYPE_VALID = 3;
  ACCEPTANCE_STATE_TEMPORALLY_VALID = 4;
  ACCEPTANCE_STATE_CLOCK_CONSISTENT = 5;
  ACCEPTANCE_STATE_OUTPUT_COMPLETE = 6;
  ACCEPTANCE_STATE_HARDWARE_FEASIBLE = 7;
}

// `(A₁, …, Aₙ) -> B` over concept ids: the relationship's canonical type is
// `domain(inputs) -> B`, where no inputs give the empty product `()` (a
// relationship read as a value, `() -> B`).  A presentation encoding — the
// empty list is that domain; nothing here is a synthetic input.
message Signature {
  repeated uint64 inputs = 1;
  uint64 output = 2;
}

message Definition {
  oneof kind {
    string formula = 1;
    // A realization by identity, produced by system flattening for a port
    // binding: `declRef target`, or `sync` from `transport.source` with the
    // closed initial value.  Never authored; shown as "bound to …".
    ReferenceDefinition reference = 2;
  }
}

message ReferenceDefinition {
  uint64 target = 1;
  optional TransportSpec transport = 2;
}

message TransportSpec {
  uint64 source_clock_id = 1;
  string init = 2;
}

message Representation {
  oneof kind {
    Dim quantity = 1;
    Unit boolean = 2;
    Unit count = 3;
    // 0.11: a value that may be absent, a collection, a grouped value.
    Representation optional = 4;
    Representation list = 5;
    PairRepresentation pair = 6;
  }
}

message PairRepresentation {
  Representation first = 1;
  Representation second = 2;
}

message Unit {}

message Dim {
  sint32 length = 1;
  sint32 mass = 2;
  sint32 time = 3;
  sint32 current = 4;
  sint32 temperature = 5;
  sint32 amount = 6;
  sint32 luminous = 7;
  sint32 angle = 8;
}

// ---------------------------------------------------------------------------
// Layout (not semantics)
// ---------------------------------------------------------------------------

message Layout {
  repeated NodePosition concepts = 1;
  repeated NodePosition mappings = 2;
  repeated NodePosition outputs = 3;
  // Component-instance nodes of a system canvas (protocol 0.8).
  repeated NodePosition instances = 4;
  // Behaviour groups of this canvas: the collapsed box and its state.
  // Layout only.  A component's groups are in its own ComponentLayout.
  repeated GroupBox groups = 5;
  // The canvas of each component's body, in component-local ids.
  repeated ComponentLayout components = 6;
  // Where the designer left this canvas.
  optional Viewport viewport = 7;
  // Mapping blocks (0.30, ADR-0044): a Sem block's definition drawn as a
  // node of its own, keyed by the Sem block's declaration id.  `mappings`
  // keys the Sem blocks; `concepts` is kept as written and drawn by
  // nothing (a concept is a template, not a node).
  repeated NodePosition definitions = 8;
}

message Viewport {
  double x = 1;
  double y = 2;
  double zoom = 3;
}

message GroupBox {
  uint64 id = 1;
  double x = 2;
  double y = 3;
  double width = 4;
  double height = 5;
  bool collapsed = 6;
}

message ComponentLayout {
  uint64 id = 1;
  Layout layout = 2;
}

message NodePosition {
  uint64 id = 1;
  double x = 2;
  double y = 3;
}

message SetLayoutRequest {
  Layout layout = 1;
}

// Arrange every visible node of every canvas from scratch (0.29): the
// explicit *Arrange Automatically* command.  Answers the arranged layout
// and applies nothing — the client sets it with SetLayout, so one write
// path and one undo mechanism serve every layout change.  Layout only:
// no revision, the scene graph as it is (ADR-0003, `bdl-layout::arrange`).
message ArrangeLayoutRequest {}

message LayoutResponse {
  Layout layout = 1;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// Sent to subscribers after every committed revision.  v0.1 sends the full
// projection; deltas are a planned protocol change (docs/spec/protocol.md).
message ProjectChanged {
  ProjectProjection project = 1;
  optional EditOutcome outcome = 2;
}

message DaemonLog {
  string level = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Simulation (the reference evaluator, driven tick by tick)
// ---------------------------------------------------------------------------

// A runtime value in the design's own terms.
message Value {
  oneof kind {
    bool boolean = 1;
    uint64 count = 2;
    Quantity quantity = 3;
    SemanticValue semantic = 4;
    Unit none = 5;
    Value some = 6;
    // A function or partially applied primitive: shown, never transported.
    string opaque = 7;
    // 0.11: collections and grouped values.
    ValueList list = 8;
    ValuePair pair = 9;
  }
}

message ValueList {
  repeated Value items = 1;
}

message ValuePair {
  Value fst = 1;
  Value snd = 2;
}

message Quantity {
  Dim dim = 1;
  double value = 2;
}

// A Sem value: a value of concept `concept_id` (the instance level of the
// concept ladder; the concept itself is the type, ADR-0043).
message SemanticValue {
  uint64 concept_id = 1;
  Value repr = 2;
}

// One value for an unresolved declaration at one tick.
message SimulationInput {
  uint64 mapping_id = 1;
  uint64 tick = 2;
  Value value = 3;
}

// Which domains activate: period 1 = every tick.  Domains not listed never
// activate; an empty schedule means every domain every tick.
message SchedulePeriod {
  uint64 clock_id = 1;
  uint64 period = 2;
}

// Starts a run against the *current* revision; refused if the design is
// not causal.  Inputs may be extended by later StartSimulation calls only by
// restarting.
message StartSimulationRequest {
  repeated SimulationInput inputs = 1;
  repeated SchedulePeriod schedule = 2;
}

message StepSimulationRequest {
  // Ticks to evaluate; the response carries their samples.
  uint64 ticks = 1;
}

message ResetSimulationRequest {}

message SimulationResponse {
  // The project revision the simulation runs against.
  uint64 revision = 1;
  // Next tick to be evaluated.
  uint64 next_tick = 2;
  // Samples produced by this request (all ticks so far for Start/Reset).
  repeated TickSample samples = 3;
  // Set when a tick could not be evaluated (missing input, division by zero…).
  optional Diagnostic error = 4;
}

message TickSample {
  uint64 tick = 1;
  repeated uint64 active_clock_ids = 2;
  repeated DeclarationSample values = 3;
}

message DeclarationSample {
  uint64 mapping_id = 1;
  Value value = 2;
  // Rendered in the design's terms, e.g. "Brightness(0.5)".
  string rendered = 3;
}

// ---------------------------------------------------------------------------
// Analysis (compiler results, revision-tagged; discard when stale)
// ---------------------------------------------------------------------------

message RunAnalysisRequest {}

message AnalysisResponse {
  ProjectAnalysis analysis = 1;
}

message AnalysisReady {
  ProjectAnalysis analysis = 1;
}

message ProjectAnalysis {
  // The revision the analysis was computed for.
  uint64 revision = 1;
  repeated MappingAnalysis mappings = 2;
  // Every diagnostic, in the documented stable order (entity, span, code).
  repeated Diagnostic diagnostics = 3;
  // Whole-design verdicts of the reactive passes.
  bool causal = 4;
  bool clock_consistent = 5;
  // Instantaneous cycles, each as the mapping ids involved.
  repeated DeclarationCycle cycles = 6;
  // Evaluation order the causality pass produced (empty when not causal).
  repeated uint64 evaluation_order = 7;
  // Output pass: every sink with a domain and where it stands.
  repeated OutputAnalysis outputs = 8;
  // Surface outputs still without a domain (neither driven nor missing).
  repeated uint64 open_outputs = 9;
  // Every drive edge well formed, one driver per sink, every required
  // sink driven, no output open.
  bool output_complete = 10;
}

enum OutputState {
  OUTPUT_STATE_UNSPECIFIED = 0;
  OUTPUT_STATE_UNDRIVEN = 1;
  OUTPUT_STATE_DRIVEN = 2;
  OUTPUT_STATE_ILL_FORMED = 3;
  OUTPUT_STATE_CONFLICT = 4;
}

message OutputAnalysis {
  uint64 id = 1;
  OutputState state = 2;
  // The single well-formed driver, when driven.
  optional uint64 driver = 3;
  // Every mapping that claims the sink (well formed or not).
  repeated uint64 claimants = 4;
}

message DeclarationCycle {
  repeated uint64 mapping_ids = 1;
}

enum MappingStatus {
  MAPPING_STATUS_UNSPECIFIED = 0;
  // Named and typed; no definition.
  MAPPING_STATUS_DECLARED = 1;
  // Defined, but something it needs is still open (not an error).
  MAPPING_STATUS_OPEN = 2;
  // Defined and does not check.
  MAPPING_STATUS_INVALID = 3;
  // Defined and produces what the signature promises.
  MAPPING_STATUS_TYPE_VALID = 4;
  // Type-valid and on no instantaneous loop: has a value at every activation.
  MAPPING_STATUS_TEMPORALLY_VALID = 5;
  // Temporally valid and every read stays in its domain or is transported.
  MAPPING_STATUS_CLOCK_CONSISTENT = 6;
}

message MappingAnalysis {
  uint64 id = 1;
  MappingStatus status = 2;
  // Kernel notation, for the explanation view only.
  string interface = 3;
  string inferred_type = 4;
  string core_expr = 5;
  repeated Diagnostic diagnostics = 6;
  // The relationships this one's definition refers to, by identity (the
  // design's dependency edges — the kernel's `dependsOn` — in id order,
  // each once, the relationship itself included when its definition names
  // it): a value that applies a rule lists that rule here.  Empty while the
  // relationship is declared only, for a Source, for a definition that does
  // not elaborate, and in a draft verdict.  The canvas draws each as a
  // reference edge (ADR-0034); protocol 0.18.
  repeated uint64 references = 7;
  // The relationships whose definition refers to this one, by identity —
  // the inverse of `references` over the whole design (the dependency
  // graph's direct reverse edges, never transitive): for a rule, the
  // values and rules that apply it.  Empty when nothing does.  Stated so
  // a client never inverts the graph itself; protocol 0.20.
  repeated uint64 applied_by = 8;
  // The derived role at this revision, the same answer as
  // `MappingView.role` (protocol 0.20).
  RelationshipRole role = 9;
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_ERROR = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_INFO = 3;
}

message SourceSpan {
  uint32 start = 1;
  uint32 end = 2;
}

message Diagnostic {
  string code = 1;
  DiagnosticSeverity severity = 2;
  oneof entity {
    Unit project = 3;
    uint64 concept_id = 4;
    uint64 mapping_id = 5;
  }
  optional SourceSpan span = 6;
  string message = 7;
  string explanation = 8;
  string technical = 9;
  repeated string fixes = 10;
}

// ---------------------------------------------------------------------------
// Definition drafts (read-only: a candidate definition checked, not committed)
// ---------------------------------------------------------------------------

// Analyse `source` as if it were the definition of `mapping_id` at
// `revision`, without committing anything.  Refused with
// `draft.stale_revision` if the project has moved on and
// `draft.unknown_mapping` if the mapping does not exist at that revision.
// `generation` is a client-chosen tag echoed back unchanged so the client
// can drop responses that a newer draft has superseded.
message AnalyzeDefinitionDraftRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  uint64 generation = 3;
  string source = 4;
  // When set, `mapping_id` is a declaration of this component's body and
  // the draft is judged in the body's own scope (protocol 0.8).
  optional uint64 component = 5;
}

message DefinitionDraftAnalysis {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  uint64 generation = 3;
  // False when the source did not parse; the diagnostics say where.
  bool parse_ok = 4;
  // The same verdict a committed definition gets; diagnostic spans index
  // the draft source of the request, not any committed source.
  MappingAnalysis analysis = 5;
  // The Formula Composer's view of the same draft (0.12): the same
  // world, the same generation, one round trip.
  FormulaProjection projection = 6;
}

// ---------------------------------------------------------------------------
// The Formula Composer (bdl-ide::formula, 0.12).  The formula text is the
// only source: the projection is a view over its syntax and elaboration,
// and every structured action is answered with the text it makes.
// ---------------------------------------------------------------------------

// The projection of the mapping's effective definition — its draft
// overlay when one exists, else the committed formula.  Sets no overlay.
// Refused with `draft.stale_revision`, `draft.unknown_mapping`; a mapping
// defined by reference answers `formula.not_applicable`.
message GetFormulaProjectionRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  optional uint64 component = 3;
}

message FormulaProjectionResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  FormulaProjection projection = 3;
}

message FormulaProjection {
  // The source the ranges index.
  string source = 1;
  // False when the source did not parse: no root, `unplaced` says where.
  bool parse_ok = 2;
  // Whether the formula elaborates: no slot, no error.
  bool complete = 3;
  optional FormulaNode root = 4;
  // What the whole formula must produce: the output concept.
  optional TypeView result = 5;
  // The slots (`?`) in source order: the Tab order.
  repeated string slots = 6;
  // Diagnostics no node owns.
  repeated Diagnostic unplaced = 7;
  // The draft overlay's generation, when the projection is of a draft.
  optional uint64 draft_generation = 8;
}

// One node of the structured view.  `id` is the tree path (`r`, `r.0`,
// `r.1.0`): authoring identity, stable within one draft generation,
// never persisted.  `range` is a byte range into `source`, parentheses
// included.
message FormulaNode {
  string id = 1;
  SourceSpan range = 2;
  // "reference", "number", "quantity", "bool", "unary", "binary",
  // "compare", "call", "slot", "opaque", "binder", "range" (0.13),
  // "if" (0.17: a choice; children: the condition, the outcome when it
  // holds, the outcome otherwise).
  string kind = 3;
  // The source text of the node.
  string text = 4;
  // The reference's or call's name, the operator's symbol, what an
  // opaque region is ("a match"), a bool literal's value, or a binder's
  // word ("all", "any", "map", "filter").
  string name = 5;
  // A quantity literal's parts: `90 deg` → "90", "deg", "angle.deg";
  // `9.81 m per s^2` → "9.81", "m per s^2" (as written), "" (no single
  // atom), with `unit_source` the canonical spelling and `unit_display`
  // the mathematical rendering `m/s²` (0.27).
  string coordinate = 6;
  string unit = 7;
  string unit_id = 8;
  string unit_source = 19;
  string unit_display = 20;
  // A call: an equation of the library (true) or a relationship (false).
  bool equation = 9;
  optional EntityRef entity = 10;
  // What the elaborator found the node to be.
  optional TypeView actual = 11;
  // What the position expects, from the context (local inference).
  optional TypeView expected = 12;
  // Why, in the designer's words ("an angle ÷ an angle = a dimensionless quantity").
  string because = 13;
  // The diagnostics whose span is this node's and no child's.
  repeated Diagnostic diagnostics = 14;
  repeated FormulaNode children = 15;
  // A reference bound by an enclosing binder (`all x in xs: …`): a local
  // of the formula, not an entity of the design (0.13).
  bool local = 16;
  // A binder's local name and what it is (one element of the collection;
  // absent while the collection is unknown).  Children: the collection,
  // the body (0.13).
  string param = 17;
  optional TypeView param_type = 18;
  // 0.27 — structure for a client that renders and navigates without
  // reparsing.  Kinds "match" (children: the subject, then one "arm"
  // each: `name` the pattern, `binds` its names, child the body), "block"
  // (children: one "let" each — `name` the pattern, `binds` its names,
  // child the value — then the result), "rule" (`binds` the parameters;
  // child the body), "list", "tuple", "delay" (initial, value), "sync"
  // (domain, initial, value) replace the former "opaque" forms; "opaque"
  // remains for `()`.
  // What the node is to its parent: "condition", "then", "else",
  // "numerator", "denominator", "left", "right", "operand", "argument 1",
  // "collection", "body", "subject", "arm 1", "value", "result", "item 1",
  // "part 1", "initial", "domain", "from", "to"; empty at the root.
  string role = 21;
  // The formula's own names in scope at this node, innermost last: what
  // a completion here may name besides the design's.
  repeated string locals = 22;
  // The names a pattern, a `let` or a rule binds.
  repeated string binds = 23;
  // Where a further child would be inserted (`f(a, b|)`, `[a, b|]`): the
  // byte offset before the closing delimiter; absent on fixed shapes.
  optional uint32 append_at = 24;
}

// A structural caret: a node and a side.  Authoring identity, stable
// within one projection generation, never kept by the daemon (0.27).
enum CaretSide {
  CARET_SIDE_UNSPECIFIED = 0;
  CARET_SIDE_BEFORE = 1;
  CARET_SIDE_AFTER = 2;
}

enum CaretMotion {
  CARET_MOTION_UNSPECIFIED = 0;
  // The previous / next caret in source order (before a node, its
  // children's carets, after it).
  CARET_MOTION_LEFT = 1;
  CARET_MOTION_RIGHT = 2;
  // The parent's caret on the same side.
  CARET_MOTION_UP = 3;
  // The first child's before (from before), the last child's after.
  CARET_MOTION_DOWN = 4;
  // After the parent.
  CARET_MOTION_EXIT = 5;
  // The next / previous slot in source order, wrapping.
  CARET_MOTION_NEXT_SLOT = 6;
  CARET_MOTION_PREVIOUS_SLOT = 7;
}

// Move a structural caret over the draft `source`'s projection: pure —
// the same tree and motion give the same answer; the daemon keeps no
// caret.  Sets the draft overlay to `source` first.
message NavigateFormulaRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  string node_id = 4;
  CaretSide side = 5;
  CaretMotion motion = 6;
  optional uint64 component = 7;
}

message NavigateFormulaResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string node_id = 3;
  CaretSide side = 4;
  // The byte offset the caret stands at, in `source`.
  uint32 offset = 5;
}

// Completion at a structural caret: the position's expected type and its
// locals come from the projection, `prefix` is what was typed there.
// Items carry `structured_insert` for the Formula view (0.27).
message CompleteFormulaCaretRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  string node_id = 4;
  CaretSide side = 5;
  string prefix = 6;
  optional uint64 component = 7;
}

// Signature help for the innermost call enclosing `node_id` (or the node
// itself when it is a call): the callee, its parameters with what each
// takes, the result, and the argument the caret is in.  `found` is false
// when no call encloses the node.
message GetFormulaSignatureRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  string node_id = 4;
  optional uint64 component = 5;
}

message FormulaSignatureResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  bool found = 3;
  string node_id = 4;
  string name = 5;
  // `clamp(x, lo, hi)`.
  string shape = 6;
  repeated ParameterHelp parameters = 7;
  string result = 8;
  optional uint32 active = 9;
  string summary = 10;
}

message ParameterHelp {
  string name = 1;
  // What the parameter takes, in the designer's words, when known.
  string expected = 2;
}

// The read-only render of a mapping's effective definition, for a canvas
// node: the same projection the editor uses, flattened to fragments in
// source order.  No draft is set; a mapping defined by reference or with
// no formula answers an empty render.
message GetFormulaRenderRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  optional uint64 component = 3;
}

message FormulaRenderResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  repeated FormulaFragment fragments = 3;
  // The source on one line.
  string compact = 4;
  string result = 5;
  uint32 error_count = 6;
  uint32 warning_count = 7;
  repeated string references = 8;
}

message FormulaFragment {
  string text = 1;
  // "reference", "local", "number", "unit" (its text is the mathematical
  // rendering, `m/s²`), "bool", "slot", "operator", "keyword",
  // "punctuation", "pattern".
  string kind = 2;
  // The node the fragment belongs to.
  string node_id = 3;
  SourceSpan range = 4;
}

message TypeView {
  // "an angle", "a Brightness (a dimensionless quantity)", "true or false".
  string description = 1;
  // "quantity", "boolean", "count", "concept", "structured", "unknown",
  // "unit" (0.14: the empty product `()`, a relationship's domain when it
  // has no inputs — never a measurement unit).
  string kind = 2;
  optional Dim dim = 3;
  optional uint64 concept_id = 4;
  // For a collection: what one element is (0.13).
  optional TypeView element = 5;
}

// What a slot (or any node's position) of the draft `source` expects and
// what fits: units of the solved dimension, references of the design by
// type, equations whose result fits.  Sets the draft overlay to `source`
// first, like completion.
message GetFormulaSlotRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  string node_id = 4;
  optional uint64 component = 5;
}

message FormulaSlotResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string node_id = 3;
  optional TypeView expected = 4;
  // "Expected: an angle, because an angle ÷ an angle = a dimensionless quantity."
  string explanation = 5;
  // The same in the kernel's terms, for Explain.
  string technical = 6;
  // The position is not locally determined (two unknown operands).
  bool insufficient = 7;
  repeated UnitCandidate units = 8;
  repeated ReferenceCandidate references = 9;
  repeated EquationCandidate equations = 10;
  // The truth values that fit a position expecting true or false, as
  // text to fill the slot with: `true`, `false` (0.17).
  repeated string booleans = 11;
}

message UnitCandidate {
  // The registry id of an atom (`angle.deg`); empty for a composite.
  string id = 1;
  // The canonical source spelling: `deg`, `rad per s`, `m per s^2` (0.27:
  // composites of the expected dimension are listed after the atoms).
  string symbol = 2;
  string measures = 3;
  // The mathematical rendering, for display: `rad/s`, `m/s²` (0.27).
  string display = 4;
}

message ReferenceCandidate {
  string label = 1;
  string insert = 2;
  optional EntityRef entity = 3;
  string produces = 4;
  uint32 relevance = 5;
}

message EquationCandidate {
  string name = 1;
  string shape = 2;
  string insert = 3;
  string summary = 4;
}

// A structured action on the draft `source`, answered with the text it
// makes.  Studio applies nothing itself: it puts the answer's `source`
// into the draft and the ordinary AnalyzeDefinitionDraft follows.
message ComposeFormulaRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  ComposeAction action = 4;
  optional uint64 component = 5;
}

message ComposeAction {
  // The node the action is on.
  string node_id = 1;
  oneof action {
    // Put `fill` where the node is (`?` → `90 deg`, `tilt`, `min(?, ?)`).
    string fill = 2;
    // `node op ?` (or `? op node` with `before`); `!` (0.17) is the
    // prefix form, `!node`, and takes no slot.
    ComposeOperator operator = 3;
    // `name(node, ?, …)` with `arity` arguments.
    ComposeCall call = 4;
    // A literal's unit; with `preserve_value` the coordinate is converted
    // so the physical quantity is unchanged.
    ComposeSetUnit set_unit = 5;
    // A literal's coordinate: the same unit, another quantity.
    string set_coordinate = 6;
    // The node becomes a slot again; a slot operand removes its operator.
    Unit remove = 7;
    // `form item in node: ?` with a fresh local name (0.13).
    ComposeBinder binder = 8;
    // `node in ? .. ?` (0.13).
    Unit range = 9;
    // A choice (0.17): a slot becomes `if ? then ? else ?`; any other
    // node becomes one outcome of it, `if ? then node else ?`.
    Unit choose = 10;
    // Keyboard input at a structural caret (0.27).
    ComposeInsert insert = 11;
    // Apply (0.28): a reference naming an equation or a rule becomes a
    // call with one slot per argument (`clamp` → `clamp(?, ?, ?)`); the
    // arity is the compiler's — `(` typed after a name in the Formula
    // view.  Refused on a value or a literal.
    Unit apply = 12;
    // Unreference (0.30, ADR-0044): every reference to the declaration
    // becomes a slot — the canvas's disconnect of a read edge, a text
    // edit of the definition.  `node_id` is ignored.  Refused when the
    // formula does not name the declaration.
    uint64 unreference = 13;
    // Read (0.30, ADR-0044): the definition's first slot becomes a
    // reference to the Sem block — the canvas's drop of a Sem block onto
    // a mapping block, a text edit of the definition.  `node_id` is
    // ignored.  Refused when the formula has no slot.
    uint64 read = 14;
  }
}

message ComposeBinder {
  // "all", "any", "map" or "filter".
  string form = 1;
}

message ComposeOperator {
  string op = 1;
  bool before = 2;
}

message ComposeCall {
  string name = 1;
  uint32 arity = 2;
}

message ComposeSetUnit {
  // A registry id (`angle.deg`) or a canonical spelling (`rad per s`,
  // 0.27).
  string unit_id = 1;
  bool preserve_value = 2;
}

// Keyboard input at a structural caret (0.27): interpreted by the
// grammar — an operator makes `node op ?`, `(` groups, a word fills a slot
// with its canonical form (`clamp` → `clamp(?, ?, ?)`, `if` → `if ? then ?
// else ?`), a unit word after a number becomes the literal's unit, `per`,
// `*` or `^` after a quantity extend its unit.  Refused with the reason
// when the text cannot stand there.
message ComposeInsert {
  CaretSide side = 1;
  string text = 2;
}

message ComposeFormulaResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  // The whole draft after the action.
  string source = 3;
  // The same as byte-range edits against the request's source.
  repeated DraftTextEdit edits = 4;
  // The node to select afterwards, by its path in `source`.
  string select = 5;
}

message DraftTextEdit {
  uint32 start = 1;
  uint32 end = 2;
  string new_text = 3;
}

// The draft is gone (revert, reload, detach): the mapping's effective
// definition is the committed one again for every later query, on every
// surface.  Ack, also when there was no draft.
message DiscardDefinitionDraftRequest {
  uint64 mapping_id = 1;
  optional uint64 component = 2;
}

// Completion inside the draft at a byte `offset` into `source`.  Sets the
// draft overlay to `source` first (so the candidates are for exactly this
// text), then asks the IDE service.  Same refusals as
// AnalyzeDefinitionDraft; an empty list is a normal answer.
message CompleteDefinitionDraftRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  uint32 offset = 4;
  optional uint64 component = 5;
}

message DraftCompletionResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  repeated DraftCompletionItem items = 3;
}

message DraftCompletionItem {
  string label = 1;
  // "input", "unit", "keyword", "concept", "representation", "mapping",
  // "template", "equation" (an equation of the library, 0.11), "local".
  string kind = 2;
  // Replace the byte range [replace_start, replace_end) of the source
  // with `insert`.
  uint32 replace_start = 3;
  uint32 replace_end = 4;
  string insert = 5;
  // Product-language type of the completed expression, when known.
  string resulting_type = 6;
  string documentation = 7;
  uint32 relevance = 8;
  // The canonical structured form for a Formula-view acceptance, when it
  // differs from `insert`: `clamp(?, ?, ?)`, `if ? then ? else ?`, a
  // relationship call with a slot per input, a composite unit's whole
  // spelling (0.27).  A client never synthesises slots itself.
  string structured_insert = 9;
}

// The concept under a byte `offset` into the draft `source`, as the IDE
// service explains it.  `found` is false when nothing semantic is there.
message HoverDefinitionDraftRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  uint32 offset = 4;
  optional uint64 component = 5;
}

message DraftHoverResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  bool found = 3;
  // The byte range of the name under the cursor.
  optional SourceSpan span = 4;
  optional uint64 concept_id = 5;
  string title = 6;
  string representation = 7;
  // "declared", "open", "defined", … (bdl-ide EntityStatus, product words).
  string status = 8;
  repeated HoverDetail details = 9;
  string explanation = 10;
  // Set by HoverEntity for entities other than concepts.
  optional EntityRef entity = 11;
  // The surface signature (`dimByTilt : Tilt -> Brightness`), when the
  // entity has one.
  string signature = 12;
  // Whether the status is one of the open (undecided) states rather than
  // a settled or a wrong one.
  bool open = 13;
  // Set when the name under the cursor is an equation of the library
  // applied here, not an entity of the design (0.22): its name; `title`
  // is then its shape (`clamp(x, lo, hi)`) and `explanation` the
  // designer's-words summary.  No entity, no status.
  string equation = 14;
}

// A stable entity of the design, by identity (never by name).
message EntityRef {
  oneof kind {
    Unit project = 1;
    uint64 concept_id = 2;
    uint64 mapping_id = 3;
    uint64 clock_id = 4;
    uint64 output_id = 5;
    uint64 device_id = 6;
  }
}

// The everyday hover card for any entity (a canvas node, a library row):
// the same DraftHoverResponse as a formula hover, with `entity` set.
// `found` is false when the entity does not exist at `revision`.
message HoverEntityRequest {
  uint64 revision = 1;
  EntityRef entity = 2;
}

// ---------------------------------------------------------------------------
// Semantic actions (bdl-ide: explicit, meaning-changing fixes, never silent)
// ---------------------------------------------------------------------------

// The actions bdl-ide offers for an entity: the fixes for its diagnostics
// plus its context actions.  Read-only; applying one is an ordinary
// ApplyEdit of the plan's edits, sent by the client against the revision
// it holds.
message ListSemanticActionsRequest {
  uint64 revision = 1;
  EntityRef entity = 2;
}

message SemanticActionsResponse {
  uint64 revision = 1;
  EntityRef entity = 2;
  repeated SemanticActionView actions = 3;
}

enum ActionApplicability {
  ACTION_APPLICABILITY_UNSPECIFIED = 0;
  // `edits` can be applied as they are.
  ACTION_APPLICABILITY_READY = 1;
  // The designer picks one of `options`; the tool never guesses.
  ACTION_APPLICABILITY_NEEDS_CHOICE = 2;
  // The language cannot express the fix yet; `reason` says why.
  ACTION_APPLICABILITY_BLOCKED = 3;
}

message SemanticActionView {
  string id = 1;
  string title = 2;
  // "quick_fix" or "refactor".
  string kind = 3;
  ActionApplicability applicability = 4;
  string reason = 5;
  repeated ActionChoiceView options = 6;
  string explanation = 7;
  // The model edits of a ready plan, in order.  Text/draft edits of a
  // plan are not carried here (the LSP applies those).
  repeated EditOp edits = 8;
  // Diagnostic codes the action addresses.
  repeated string addresses = 9;
  // Product-language summary of what the plan would reopen.
  string invalidation = 10;
}

message ActionChoiceView {
  string label = 1;
  EditOp edit = 2;
}

message HoverDetail {
  string label = 1;
  string value = 2;
}

// ---------------------------------------------------------------------------
// Concept libraries (authoring vocabulary; never concept identity)
// ---------------------------------------------------------------------------

// The concept libraries the daemon serves (the Standard Library's Concept items
// today; team/project/package libraries later), plus the shared quantity
// vocabulary Studio's unit picker and the library rows both read.
// Independent of any project: may be asked before one is open.
message ListConceptTemplatesRequest {}

message ConceptTemplatesResponse {
  repeated ConceptLibraryView libraries = 1;
  repeated QuantityView quantities = 2;
}

message ConceptLibraryView {
  // Library identity (`std`); template ids are prefixed by it.
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  string version = 4;
  repeated ConceptTemplateView templates = 5;
}

enum RoleHint {
  ROLE_HINT_UNSPECIFIED = 0;
  ROLE_HINT_INPUT = 1;
  ROLE_HINT_OUTPUT = 2;
  ROLE_HINT_EITHER = 3;
}

// A template for creating an ordinary Concept.  Every field but `id` is a
// default the designer may change after instantiation; `id` is a library
// identity, never a ConceptId.
message ConceptTemplateView {
  string id = 1;
  string display_name = 2;
  string default_name = 3;
  string description = 4;
  string category = 5;
  RoleHint role_hint = 6;
  // Absent for a template that leaves the representation to be decided.
  optional Representation representation = 7;
  // The textual type name of the representation (`Illuminance`), for
  // previews; empty when open.
  string type_name = 8;
  // The suggested unit symbol (`lx`); empty when none.
  string unit = 9;
  repeated string keywords = 10;
  // A generic presentation hint (`temperature`, `motor`); never semantic.
  string icon = 11;
  // Deprecated since 0.17 (never set): a Source is a library item
  // (`LibraryItemView.category = "source"`) whose `creates` lists the
  // relationship; localized text is the client's, by item id.  Kept for
  // 0.16 clients; removed at the next incompatible protocol.
  string source_default_name = 12 [deprecated = true];
  map<string, string> display_names = 13 [deprecated = true];
  map<string, string> descriptions = 14 [deprecated = true];
}

// One named quantity of the shared vocabulary (`bdl_model::quantity`).
message QuantityView {
  string id = 1;
  string type_name = 2;
  // The preferred unit's mathematical rendering (`m/s`, `N·m`): display,
  // as before 0.27.
  string unit = 3;
  Dim dim = 4;
  // 0.27: the preferred unit as a descriptor (its canonical source
  // spelling `m per s`, its display, its dimension); absent for the
  // dimensionless quantity.
  optional UnitExprView preferred_unit = 5;
}

// A unit expression: a finite product of registered linear atoms with
// signed integer powers, normalised (0.27).  Never a Sem type: it
// denotes a dimension and a scale from the authored coordinate to the
// canonical magnitude.
message UnitExprView {
  // The canonical BDL spelling: `deg`, `rad per s`, `m per s^2`, `N * m`.
  string source = 1;
  // The mathematical rendering, presentation only: `rad/s`, `m/s²`, `N·m`.
  string display = 2;
  Dim dim = 3;
  // The registry id when the unit is one atom (`angle.deg`).
  string atom_id = 4;
  repeated UnitFactorView factors = 5;
}

message UnitFactorView {
  string atom_id = 1;
  string symbol = 2;
  sint32 exponent = 3;
}

// The compiler-owned authoring categories (0.27): every named quantity of
// the vocabulary as a value category, plus the truth value and the count
// — what a concept may be represented by, with the units a designer is
// offered for it.  A category is type vocabulary, never a concept: `Angle`
// here, `LidAngle` in a design with its own identity.  Independent of any
// project.
message ListValueCategoriesRequest {}

message ValueCategoriesResponse {
  repeated ValueCategoryView categories = 1;
}

message ValueCategoryView {
  // `angular_velocity`, `boolean`, `count`.
  string id = 1;
  // The canonical English word: `angular velocity`; a client localizes by
  // `id`.
  string display_name = 2;
  // The textual type name (`AngularVelocity`, `Bool`, `Count`): what the
  // Code view writes.
  string type_name = 3;
  // The value form a concept of this category is represented by.
  Representation representation = 4;
  // For a quantity: its dimension.
  optional Dim dim = 5;
  // For a quantity: the preferred unit, and the units a designer is
  // offered — the registered atoms of the dimension, then the curated
  // composites (`rad per s`, `deg per s`, `turn per s`).  A bounded list,
  // never every compatible atom combined.
  optional UnitExprView preferred_unit = 6;
  repeated UnitExprView units = 7;
}

// The one instantiation operation: the daemon builds the CreateConcept
// edit from the template's defaults (with a name that is free in the
// project, or `name` when given) and applies it like ApplyEdit.  Answered
// with EditApplied; `edit.stale_revision` if the project moved on,
// `library.unknown_template` if the id is not served.
message InstantiateConceptTemplateRequest {
  uint64 base_revision = 1;
  string template_id = 2;
  optional string name = 3;
  // On a system project: insert into this component's body instead of the
  // system's own design (protocol 0.8).  Answered with SystemEditApplied.
  optional uint64 component = 4;
  // Deprecated since 0.17 (ignored): a Source is instantiated through
  // InstantiateLibraryItem, whose `names` name every object by key.
  optional string source_name = 5 [deprecated = true];
}

// The Standard Library as items (0.17).  An item is a reusable authoring
// fragment built from ordinary BDL structures: a Concept item creates one
// concept, a Source item a concept and an unresolved relationship without
// inputs (`() -> Value`).  Instantiation is one transaction: one revision,
// one undo step, every object with a fresh identity; nothing about the item
// is recorded in the project, and no category carries semantics — the Source
// role is derived from the objects' shape (ADR-0032).  `display_name` and
// `description` are the canonical English; a client localizes by `id`.
message ListLibraryItemsRequest {}

message LibraryItemsResponse {
  repeated LibraryView libraries = 1;
  repeated QuantityView quantities = 2;
}

message LibraryView {
  string id = 1;
  string name = 2;
  uint32 schema_version = 3;
  string version = 4;
  repeated LibraryItemView items = 5;
}

message LibraryItemView {
  string id = 1;
  // "concept" | "source".
  string category = 2;
  string display_name = 3;
  string description = 4;
  // Grouping inside the category (`environment`, `motion`, …).
  string group = 5;
  repeated string keywords = 6;
  string icon = 7;
  // What the item creates, in creation order, with the default names.
  repeated LibraryObjectView creates = 8;
  // The concept-template view of a Concept item (its representation, unit
  // and role hint); absent for other categories.
  optional ConceptTemplateView concept = 9;
  // The preset view of a Source item (0.23): what the Source creation
  // flow prefills — names, a value form, a unit — and ranks existing
  // concepts by.  The item decides nothing about identity: the Source is
  // created over the concept the designer chooses (`CreateSource`).
  // `creates` still describes what `InstantiateLibraryItem` would make of
  // the item (the legacy path: concept and Source together).
  optional SourcePresetView preset = 10;
}

message SourcePresetView {
  string concept_name = 1;
  string concept_description = 2;
  optional Representation representation = 3;
  // The textual type name of the value form (`Temperature`), empty when open.
  string type_name = 4;
  string unit = 5;
  string source_name = 6;
  string source_description = 7;
}

message LibraryObjectView {
  // "concept" | "mapping".
  string kind = 1;
  // Fragment-local key (`value`, `source`), what `InstantiateLibraryItem`
  // names a chosen name by; never a project identity.
  string key = 2;
  string name = 3;
  // A concept's textual type name (`Temperature`), empty when open.
  string type_name = 4;
  // A mapping's signature as written (`() -> RoomTemp`).
  string signature = 5;
  string description = 6;
  optional Representation representation = 7;
  string unit = 8;
}

// Instantiate one item: the daemon plans the fragment against the target
// design (names free in it, or `names` by object key) and applies every
// step in one transaction.  Answered with SystemEditApplied (every project
// is a behaviour system); `edit.stale_revision` if the project moved on,
// `library.unknown_item` if the id is not served.  Nothing is applied when
// any step is refused.
message InstantiateLibraryItemRequest {
  uint64 base_revision = 1;
  string item_id = 2;
  map<string, string> names = 3;
  optional uint64 component = 4;
}

// Create a Source — `<source_name> : () -> C`, no definition (ADR-0032) —
// over a concept the designer chose: an existing concept of the design in
// scope (the system's own, or `component`'s body), or a new concept
// created in the same transaction.  One revision, one history entry, all
// or nothing: when either edit is refused nothing is applied and no
// identity is consumed.  Answered with SystemEditApplied whose outcome
// carries `created_mapping` and, for a new concept, `created_concept`.
// `edit.stale_revision`, `edit.unknown_concept`, `edit.duplicate_*`,
// `edit.invalid_name`.  The result is ordinary objects: the Source is a
// Source because of its shape, and nothing records how it was made.
message CreateSourceRequest {
  uint64 base_revision = 1;
  optional uint64 component = 2;
  string source_name = 3;
  string source_description = 4;
  oneof concept {
    // A concept of the design in scope, by identity — never by name or
    // value form.
    uint64 existing_concept = 5;
    NewConcept new_concept = 6;
  }
}

message NewConcept {
  string name = 1;
  string description = 2;
  // Absent: the value form is decided later, as for CreateConcept.
  optional Representation representation = 3;
  // 0.27: a value category by id (`angular_velocity`, `boolean`, `count`
  // — ListValueCategories) in place of a representation: the daemon
  // resolves it, so a client builds no Representation.  `representation`
  // wins when both are given; an unknown id is `library.unknown_category`.
  // A chosen unit is presentation and is never part of the concept.
  optional string category_id = 4;
}

// The concepts a Source may be created over, in the order the creation
// flow lists them (0.23): every concept of the design in scope — identity
// is nominal, two concepts of one value form are two choices — with the
// ones whose value form is the preset's first (`preferred`) when
// `item_id` names a Source item.  With an empty `item_id` (a generic New
// Source) every concept in id order.  Ranking is authoring convenience,
// never a rule: a Source `() -> C` is legal over any `C`.
message ListSourceCandidatesRequest {
  uint64 revision = 1;
  optional uint64 component = 2;
  string item_id = 3;
}

message SourceCandidatesResponse {
  uint64 revision = 1;
  repeated SourceCandidateView candidates = 2;
  // The preset, when `item_id` named a Source item.
  optional SourcePresetView preset = 3;
  // The preset's names made free in the design (`Temperature`,
  // `temperatureInput`; `Temperature2` when taken); empty without a preset.
  string suggested_concept_name = 4;
  string suggested_source_name = 5;
}

message SourceCandidateView {
  uint64 concept_id = 1;
  bool preferred = 2;
}

// ---------------------------------------------------------------------------
// Deployment (target-relative; never part of the semantic analysis)
// ---------------------------------------------------------------------------

message ListTargetsRequest {}

message TargetsResponse {
  repeated TargetView targets = 1;
}

// What a target chooser shows.  `id` is opaque: never parse it for meaning.
message TargetView {
  // Registry id, e.g. "arduino_nano".
  string id = 1;
  // Same as `display_name` (kept for 0.3 clients).
  string name = 2;
  uint32 resource_count = 3;
  string display_name = 4;
  string description = 5;
  // Board/platform family, e.g. "avr", "rp2040", "mock".
  string family = 6;
  // How many resources offer each capability; capabilities the target
  // lacks are absent.
  repeated CapabilitySummary capabilities = 7;
}

message CapabilitySummary {
  // Stable capability name, e.g. "pwm".
  string capability = 1;
  // Designer-facing wording, e.g. "PWM".
  string label = 2;
  uint32 resource_count = 3;
  // Several requirements may share one resource for this capability (buses).
  bool shareable = 4;
}

message AnalyzeDeploymentRequest {
  string target_id = 1;
  // When set, the request is refused with `deploy.stale_revision` unless
  // it equals the project's current revision — so a client never gets a
  // result for a project it no longer holds.
  optional uint64 revision = 2;
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_FEASIBLE = 1;
  DEPLOYMENT_STATUS_INFEASIBLE = 2;
  // Placement succeeds but an output has no device, or a device no output.
  DEPLOYMENT_STATUS_INCOMPLETE = 3;
}

message DeploymentResponse {
  DeploymentAnalysis deployment = 1;
}

// Two layers in one message.  Fields 1–9 are the analysis as computed
// (requirements, placement, dead end by stable ids).  Fields 10–15 are
// the read model a frontend renders from directly — names, labels, what
// is missing, the blocker — composed from the semantic analysis and the
// deployment analysis at the daemon (docs/architecture/deployment-read-model.md).
message DeploymentAnalysis {
  // The project revision this describes; discard when it moves on.
  uint64 revision = 1;
  // Target id (opaque).
  string target = 2;
  // Target-relative: do the bound devices fit?  Feasible / Infeasible /
  // Incomplete (a device without an output or an output without a device).
  DeploymentStatus status = 3;
  repeated RequirementView requirements = 4;
  // The witness, when a placement exists: one placement per requirement.
  repeated Placement assignment = 5;
  optional DeadEnd dead_end = 6;
  repeated uint64 unbound_devices = 7;
  repeated uint64 unrealised_outputs = 8;
  repeated Diagnostic diagnostics = 9;

  // ---- read model ----
  string target_display_name = 10;
  // Target-independent: every relationship checks, the design is causal
  // and clock-consistent, and its outputs are complete.
  bool design_ready = 11;
  // `design_ready && status == FEASIBLE`.
  bool deployable = 12;
  // What is still missing, semantic items first; empty when deployable.
  repeated MissingItem missing = 13;
  // One row per requirement in (output, device, index) order; resource
  // columns filled when a placement exists.
  repeated AssignmentRow rows = 14;
  // When infeasible: the first dead end, named.  Not a minimal core.
  optional Blocker blocker = 15;
  // One per device bound to an output (0.24): the realization judgment,
  // target-independent, plus the profiles the output could use.
  repeated RealizationView realizations = 16;
  // One per Source of the design (0.25): the provision judgment — which
  // device provides it, whether the provider fits — plus the profiles the
  // Source could use.  A Source with no row here does not exist; a Source
  // with no device is an incomplete deployment.
  repeated ProvisionView provisions = 17;
  // Whether this board's firmware can be built from the project as it is
  // (0.26): the design is ready, every output driven, every device
  // admissible and placed, every Source provided by a profile this
  // board's adapter reads.  The same judgments the build makes, made
  // before the button is offered; nothing about the toolchain.
  bool build_ready = 18;
  // When not ready: what stands in the way, the smallest actionable thing
  // first.  Empty when `build_ready`.
  repeated BuildBlocker build_blockers = 19;
}

// One thing that stops a build, in product language, with the object it
// is about so a page can lead to it.
message BuildBlocker {
  // A stable code: a MissingKind's name in snake case (`output_no_device`)
  // or an `adapter.*` diagnostic's code.
  string code = 1;
  string message = 2;
  string explanation = 3;
  optional uint64 output_id = 4;
  optional uint64 device_id = 5;
  optional uint64 mapping_id = 6;
}

// How a Source's provision stands (0.25).  The same shape as
// RealizationStatus, on the input side: the semantic half is the
// transducer's, hardware feasibility is the deployment's `status`, and
// whether the chosen target's adapter can read the profile is the
// backend's.
enum ProvisionStatus {
  PROVISION_STATUS_UNSPECIFIED = 0;
  // No device provides this Source: the deployment is incomplete.
  PROVISION_STATUS_NO_DEVICE = 1;
  // A device is bound but no profile is chosen.
  PROVISION_STATUS_NOT_CHOSEN = 2;
  // The persisted profile id is not in this daemon's catalogue.
  PROVISION_STATUS_UNKNOWN_PROFILE = 3;
  // The profile's transducer produces a different representation than the
  // Source's concept carries.
  PROVISION_STATUS_INCOMPATIBLE = 4;
  // The transducer is ill typed or not pure (a catalogue defect).
  PROVISION_STATUS_TRANSDUCER_INVALID = 5;
  // The profile's requirement template differs from the device's kind.
  PROVISION_STATUS_KIND_MISMATCH = 6;
  // Transducer well typed and the representation fits.
  PROVISION_STATUS_VALID = 7;
}

message ProvisionView {
  uint64 source_id = 1;
  string source_name = 2;
  optional uint64 device_id = 3;
  string device_name = 4;
  optional string profile_id = 5;
  ProvisionStatus status = 6;
  // The inspectable judgments behind admissibility.
  bool profile_known = 7;
  bool transducer_well_formed = 8;
  bool representation_fits = 9;
  // Every requirement of the providing device is placed in `assignment`.
  bool hardware_placed = 10;
  // The chosen target's adapter can read this profile; false with a
  // reason in `message` when the target has no reader for it.
  bool backend_supported = 11;
  string message = 12;
  string explanation = 13;
  // Every catalogue input profile, with whether it fits this Source.
  repeated InputProfileView candidates = 14;
}

message InputProfileView {
  string id = 1;
  string display_name = 2;
  string description = 3;
  DeviceKind kind = 4;
  // The raw reading type, printed.
  string raw_type = 5;
  // The transducer's representation, printed.
  string representation = 6;
  bool compatible = 7;
  // Where the profile comes from: "builtin" or "package <id>".  Display
  // data only; no judgment reads it.
  string origin = 8;
}

// How a device's realization of its output stands.  Hardware feasibility is
// the deployment's `status`; this is the semantic half (encoder well typed,
// representation fits) — admissible means both halves hold.
enum RealizationStatus {
  REALIZATION_STATUS_UNSPECIFIED = 0;
  // No profile chosen: the device places by kind, no raw command is lowered.
  REALIZATION_STATUS_NOT_CHOSEN = 1;
  // The persisted profile id is not in this daemon's registry.
  REALIZATION_STATUS_UNKNOWN_PROFILE = 2;
  // The profile's encoder expects a different representation than the
  // output's concept carries.
  REALIZATION_STATUS_INCOMPATIBLE = 3;
  // The encoder is ill typed or not pure (a registry defect; never a
  // designer's fault).
  REALIZATION_STATUS_ENCODER_INVALID = 4;
  // The profile's requirement template differs from the device's kind.
  REALIZATION_STATUS_KIND_MISMATCH = 5;
  // Encoder well typed and the representation fits.
  REALIZATION_STATUS_ENCODING_VALID = 6;
}

message RealizationView {
  uint64 device_id = 1;
  string device_name = 2;
  optional uint64 output_id = 3;
  string output_name = 4;
  optional string profile_id = 5;
  RealizationStatus status = 6;
  // The three inspectable judgments behind admissibility.
  bool encoder_well_formed = 7;
  bool representation_fits = 8;
  // Every requirement of this device is placed in `assignment`.
  bool hardware_placed = 9;
  string message = 10;
  string explanation = 11;
  // Every registry profile, with whether it fits this output's concept.
  repeated OutputProfileView candidates = 12;
}

message OutputProfileView {
  string id = 1;
  string display_name = 2;
  string description = 3;
  // The hardware requirement template the profile needs.
  DeviceKind kind = 4;
  // The raw command type, printed.
  string raw_type = 5;
  // The encoder's representation, printed.
  string representation = 6;
  bool compatible = 7;
}

enum MissingKind {
  MISSING_KIND_UNSPECIFIED = 0;
  // Semantic (about the design itself).
  MISSING_KIND_RELATIONSHIP_NOT_CHECKING = 1;
  MISSING_KIND_NOT_CAUSAL = 2;
  MISSING_KIND_NOT_CLOCK_CONSISTENT = 3;
  MISSING_KIND_OUTPUT_NO_DOMAIN = 4;
  MISSING_KIND_OUTPUT_NO_DRIVER = 5;
  MISSING_KIND_OUTPUT_CONNECTION_INVALID = 6;
  // Deployment configuration (about devices on this target).
  MISSING_KIND_OUTPUT_NO_DEVICE = 7;
  MISSING_KIND_DEVICE_NO_OUTPUT = 8;
  // The device's chosen realization is unknown, does not fit or is defective (0.24).
  MISSING_KIND_REALIZATION_INVALID = 9;
  // No device provides this Source (0.25).
  MISSING_KIND_SOURCE_NO_DEVICE = 10;
  // The device's chosen provider is unknown, does not fit or is defective (0.25).
  MISSING_KIND_PROVIDER_INVALID = 11;
}

message MissingItem {
  MissingKind kind = 1;
  optional uint64 output_id = 2;
  string output_name = 3;
  optional uint64 device_id = 4;
  string device_name = 5;
  optional uint64 mapping_id = 6;
  string mapping_name = 7;
  // Product language; `explanation` says why it matters and what to do.
  string message = 8;
  string explanation = 9;
}

message AssignmentRow {
  optional uint64 output_id = 1;
  string output_name = 2;
  uint64 device_id = 3;
  string device_name = 4;
  DeviceKind device_kind = 5;
  string device_kind_label = 6;
  uint32 requirement_index = 7;
  // The requirement's role on the device: "PWM", "direction", "SDA".
  string requirement_label = 8;
  string capability = 9;
  string capability_label = 10;
  // Chosen by hand, if any.
  optional string fixed = 11;
  // The resource carrying it; absent when no placement exists.
  optional string resource = 12;
  // The resource in the target's terms: "D3: digital in, digital out, PWM (timer 2), interrupt".
  optional string resource_label = 13;
}

message Blocker {
  uint64 device_id = 1;
  string device_name = 2;
  uint32 requirement_index = 3;
  string requirement_label = 4;
  string capability = 5;
  string capability_label = 6;
  oneof kind {
    Unit no_capable_resource = 7;
    // The pin chosen by hand is not on the target or lacks the capability.
    string fixed_unavailable = 8;
    // Every capable pin is taken (or would violate a shared-unit relation).
    BlockerCandidates blocked = 9;
  }
  string message = 10;
  string explanation = 11;
}

message BlockerCandidates {
  repeated BlockerCandidate candidates = 1;
}

message BlockerCandidate {
  string resource = 1;
  string resource_label = 2;
  uint64 held_by_device_id = 3;
  string held_by_device_name = 4;
  uint32 held_by_requirement_index = 5;
  string held_by_requirement_label = 6;
}

message RequirementView {
  uint64 device_id = 1;
  uint32 index = 2;
  string capability = 3;
  optional string fixed = 4;
  string label = 5;
}

message Placement {
  uint64 device_id = 1;
  uint32 index = 2;
  string resource = 3;
}

// One explanation of infeasibility: the first requirement greedy placement
// could not place, and what blocked each candidate.  Not a minimal core.
message DeadEnd {
  uint64 device_id = 1;
  uint32 index = 2;
  oneof reason {
    Unit no_capable_resource = 3;
    string fixed_unavailable = 4;
    BlockedCandidates blocked = 5;
  }
  repeated Placement placed = 6;
}

message BlockedCandidates {
  repeated BlockedCandidate candidates = 1;
}

message BlockedCandidate {
  string resource = 1;
  uint64 held_by_device_id = 2;
  uint32 held_by_index = 3;
}

// ---------------------------------------------------------------------------
// Firmware: build, artifact, flash (0.26)
// ---------------------------------------------------------------------------
//
// The daemon owns the whole path from the project to the board: it
// generates the crate, drives cargo, packages the image and writes it to
// the device.  A client asks and watches; it never runs a tool itself.
// A build is a sequence of stages reported as events; its outcome is a
// status a client can ask for again (after reopening the project, say).
// The artifact carries the identity of what it was built from, so a
// changed design, deployment or setting makes it stale and a stale image
// is never flashed.

// Start building the firmware of `target_id` from the project as it is.
// Answers Ack at once (or `build.busy`, `build.unknown_target`,
// `build.not_ready`); progress arrives as BuildProgress events.
message BuildFirmwareRequest {
  string target_id = 1;
  // Refused with `build.stale_revision` unless it is the project's.
  optional uint64 revision = 2;
}

message GetBuildStatusRequest {
  string target_id = 1;
}

// Stop the running build, if any; the build ends CANCELLED.
message CancelBuildRequest {}

enum BuildStage {
  BUILD_STAGE_UNSPECIFIED = 0;
  // The deployment is judged: every refusal the firmware would meet.
  BUILD_STAGE_CHECKING = 1;
  // The crate is generated and written.
  BUILD_STAGE_GENERATING = 2;
  // The toolchain and the runtime crates are located.
  BUILD_STAGE_PREPARING = 3;
  // cargo compiles the crate for the board.
  BUILD_STAGE_COMPILING = 4;
  // The image the board takes (UF2) is written from the ELF.
  BUILD_STAGE_PACKAGING = 5;
  BUILD_STAGE_COMPLETED = 6;
  BUILD_STAGE_FAILED = 7;
  BUILD_STAGE_CANCELLED = 8;
}

message BuildProgress {
  uint64 build_id = 1;
  string target_id = 2;
  BuildStage stage = 3;
  // What is happening now, in product language ("Compiling embassy-rp").
  string message = 4;
  // Crates compiled so far, when known.
  optional uint32 done = 5;
  // A line for the advanced view (a compiler line, a command); may be empty.
  string detail = 6;
  // On COMPLETED, FAILED or CANCELLED: the status as `GetBuildStatus` gives it.
  optional BuildStatus status = 7;
}

message BuildStatusResponse {
  BuildStatus status = 1;
}

// What is known about the firmware of one target for the open project.
message BuildStatus {
  string target_id = 1;
  bool running = 2;
  // The running build's stage, or the last build's outcome stage
  // (COMPLETED, FAILED, CANCELLED); UNSPECIFIED when nothing was built.
  BuildStage stage = 3;
  // The last artifact built for this target, if one exists on disk.
  optional BuildArtifact artifact = 4;
  // Whether `artifact` was built from what the project says now: the same
  // generated crate, the same settings, the same compiler.  False means
  // the image on the board — if it was flashed — is not the design on
  // screen.
  bool artifact_fresh = 5;
  // The last build's failure, until a build succeeds or is started again.
  optional BuildFailure failure = 6;
  // Advanced: where the crate is, what is run, for which triple, what the
  // compiler said (the last lines).
  string generated_dir = 7;
  string command = 8;
  string triple = 9;
  repeated string output = 10;
}

message BuildArtifact {
  // The image to write to the board (a UF2 for the Raspberry Pi Pico).
  string path = 1;
  // "uf2", "elf" or "hex".
  string kind = 2;
  // The linked ELF the image was made from.
  string elf_path = 3;
  // The content identity of what it was built from (a hash).
  string identity = 4;
  // Seconds since the Unix epoch.
  uint64 built_at = 5;
  // The project revision the build started from (informational; identity
  // is what freshness is judged by).
  uint64 revision = 6;
  string compiler_version = 7;
  uint64 size_bytes = 8;
}

message BuildFailure {
  BuildStage stage = 1;
  // `build.not_ready`, `build.toolchain_missing`, `build.target_missing`,
  // `build.runtime_missing`, `build.cargo_failed`, `build.package_failed`,
  // `build.io`.
  string code = 2;
  string message = 3;
  string explanation = 4;
  // On CHECKING: the compiler's refusals (`adapter.*`, `backend.*`).
  repeated Diagnostic diagnostics = 5;
  // Advanced: the command that failed and what it printed (the tail).
  string command = 6;
  repeated string output = 7;
}

// The devices a flash of `target_id` could reach now, and the ways this
// host can flash it.
message ListFlashDevicesRequest {
  string target_id = 1;
}

message FlashDevicesResponse {
  repeated FlashDevice devices = 1;
  repeated FlashMethodView methods = 2;
}

enum FlashMethod {
  FLASH_METHOD_UNSPECIFIED = 0;
  // The board's own bootloader mounted as a volume (RPI-RP2 on the Pico,
  // held BOOTSEL while plugging in); the image is copied onto it.
  FLASH_METHOD_UF2_VOLUME = 1;
  // A debug probe driven by probe-rs.
  FLASH_METHOD_PROBE = 2;
}

message FlashDevice {
  // Opaque; pass back to FlashFirmware.
  string id = 1;
  FlashMethod method = 2;
  // "Raspberry Pi Pico in BOOTSEL mode (RPI-RP2)", "Debug Probe (CMSIS-DAP)".
  string label = 3;
  // The volume's path, the probe's identity.
  string detail = 4;
}

message FlashMethodView {
  FlashMethod method = 1;
  // Whether this host can use the method at all (a tool is installed, the
  // target supports it).
  bool available = 2;
  string label = 3;
  // What to do to make it available or to make a device appear.
  string hint = 4;
}

// Write the last artifact to one device.  Refused with `flash.no_artifact`,
// `flash.artifact_stale` (build again first), `flash.no_device`,
// `flash.ambiguous_device` (several reachable, none chosen — never flashed
// silently), `flash.unknown_device`, `flash.busy`.  Progress arrives as
// FlashProgress events.
message FlashFirmwareRequest {
  string target_id = 1;
  // From ListFlashDevices; may be absent when exactly one device is reachable.
  optional string device_id = 2;
}

enum FlashStage {
  FLASH_STAGE_UNSPECIFIED = 0;
  FLASH_STAGE_PREPARING = 1;
  FLASH_STAGE_WRITING = 2;
  // The board restarts into the new image.
  FLASH_STAGE_RESTARTING = 3;
  FLASH_STAGE_COMPLETED = 4;
  FLASH_STAGE_FAILED = 5;
}

message FlashProgress {
  uint64 flash_id = 1;
  string target_id = 2;
  FlashStage stage = 3;
  string message = 4;
  FlashDevice device = 5;
  // The artifact written.
  optional BuildArtifact artifact = 6;
  // On FAILED.
  optional FlashFailure failure = 7;
  // When this stage was reached, seconds since the Unix epoch.
  uint64 at = 8;
}

message FlashFailure {
  FlashStage stage = 1;
  // `flash.write_failed`, `flash.device_gone`, `flash.tool_failed`.
  string code = 2;
  string message = 3;
  string explanation = 4;
  string command = 5;
  repeated string output = 6;
}

// The designs a new project can start from (0.26).
message ListTemplatesRequest {}

message TemplatesResponse {
  repeated TemplateView templates = 1;
}

message TemplateView {
  // Pass to InitProject.template.
  string id = 1;
  string display_name = 2;
  string description = 3;
  // The board the template is written for, when it is a hardware demo.
  string target_id = 4;
  // Whether the template comes with its deployment (devices, providers,
  // realizations, pins) or leaves it to the designer.
  bool configured = 5;
}

// ---------------------------------------------------------------------------
// Behaviour systems (reusable components, instances, bindings)
// ---------------------------------------------------------------------------
//
// A system project's authored truth is a BehaviorSystem; the flat design
// every other request sees (RunAnalysis, simulation, deployment, drafts)
// is DERIVED from it on every commit and is never edited directly
// (docs/architecture/behavior-systems.md).  `OpenProject` opens either
// kind; `ProjectProjection.kind` says which.  Ordinary flat projects are
// untouched by all of this.

message InitSystemProjectRequest {
  string root_path = 1;
  string name = 2;
}

// Create a text project: `bdl.toml` (kind = text), `src/main.bdl`, the
// identity and authoring sidecars.
message InitTextProjectRequest {
  string root_path = 1;
  string name = 2;
}

// Re-read the open project from disk, dropping the in-memory design
// (identities return through the sidecar).  Answers like OpenProject.
message ReloadProjectRequest {}

// ---------------------------------------------------------------------------
// Sources: the Code view of the one project (ADR-0023 §3–§5; 0.10)
// ---------------------------------------------------------------------------

// The source files as the Code view shows them: the files as loaded with
// every committed semantic edit written back (the same item-level splice
// a save performs, so comments and formatting outside a touched item
// stay), plus any text draft the semantic project has not accepted yet,
// exactly as typed.
message GetSourcesRequest {}

message SourcesResponse {
  SourcesView sources = 1;
}

message SourcesView {
  uint64 revision = 1;
  repeated SourceFileView files = 2;
  // Why a draft does not build; empty when every file is the committed
  // project's.  An `open` diagnostic is incompleteness, not an error, and
  // does not keep a draft from building.
  repeated SourceDiagnostic diagnostics = 3;
}

message SourceFileView {
  // Relative to the project root, e.g. `src/main.bdl`.
  string path = 1;
  string text = 2;
  // True when `text` is a draft the semantic project has not accepted:
  // the graph shows the last revision that built.
  bool draft = 3;
  // Where each entity is declared in `text` (empty for a draft): the
  // Split view's selection sync.
  repeated SourceAnchor anchors = 4;
}

// The whole item declaring one entity, in byte offsets.  An entity of a
// component's body (or a port) carries its component; the ids are then
// component-local.
message SourceAnchor {
  uint32 start = 1;
  uint32 end = 2;
  optional uint64 component = 3;
  oneof entity {
    uint64 concept_id = 4;
    uint64 mapping_id = 5;
    uint64 clock_id = 6;
    uint64 output_id = 7;
    uint64 device_id = 8;
    uint64 component_id = 9;
    uint64 instance_id = 10;
    uint64 port_id = 11;
  }
}

message SourceDiagnostic {
  string path = 1;
  // `syntax`, or the loader's `text.<reason>`.
  string code = 2;
  string message = 3;
  // Byte offsets into the file's UTF-8 text.
  uint32 start = 4;
  uint32 end = 5;
  bool open = 6;
}

// A text edit from the Code view: the whole text of one file, against the
// revision it was read at (refused with `edit.stale_revision` otherwise).
// When the sources build, the project moves to a new revision — every
// declaration bound to its identity by reconciliation against the working
// identity table, new entities placed by the layout service — and
// `accepted` is true.  When they do not, the committed project stays,
// the draft is kept (GetSources returns it, marked) and `diagnostics`
// say why.  A save writes the accepted text.
message ApplySourceEditRequest {
  uint64 base_revision = 1;
  string path = 2;
  string text = 3;
}

message SourceEditApplied {
  bool accepted = 1;
  // The current projection either way (new revision when accepted).
  ProjectProjection project = 2;
  SourcesView sources = 3;
}

// Semantic tokens (protocol 0.21): the classes of a text's spans as the
// IDE service states them, on the LSP semantic-token vocabulary
// (`docs/architecture/syntax-highlighting.md`).  The daemon classifies;
// a client colours.  No colour, font or theme word ever crosses the
// wire, and a client never tokenizes BDL itself.  The text is sent
// whole, as typed — the same text that `ApplySourceEdit` or
// `AnalyzeDefinitionDraft` carries — so the tokens are over exactly the
// bytes the client has, whether or not that text builds: what the tree
// recognises keeps its lexical class, what the project resolves gains
// its semantic class.
message SemanticTokensRequest {
  // The revision the client's text is against.  Informational: the
  // daemon answers over its current project and states its own
  // revision; a client compares.
  uint64 revision = 1;
  // The client's own counter for this document, echoed back so a late
  // answer to an older text is recognised and dropped.
  uint64 generation = 2;
  // The text to classify, exactly as the client has it.
  string text = 3;
  oneof document {
    // A source file of the project, by path (`src/main.bdl`): the Code
    // view.  Classified as an overlay over the project's sources, so the
    // other files' declarations resolve.
    string path = 4;
    // One relationship's definition, as the formula editor has it: the
    // draft overlay of that relationship, in its own scope.
    FormulaDocument formula = 5;
  }
}

message FormulaDocument {
  uint64 mapping_id = 1;
  // The component whose body the relationship belongs to; absent for the
  // system's own.
  optional uint64 component = 2;
}

message SemanticTokensResponse {
  // The revision the daemon classified at.
  uint64 revision = 1;
  // `SemanticTokensRequest.generation`, echoed.
  uint64 generation = 2;
  // The vocabulary the indices below are into.  Sent with every answer
  // (it is small) so a client never assumes a legend it has not seen.
  SemanticTokenLegend legend = 3;
  // The byte length of the text classified: a client that has since
  // typed compares before applying.
  uint32 text_len = 4;
  // Sorted by `start`, non-overlapping, never empty, on character
  // boundaries.
  repeated SemanticToken tokens = 5;
}

// The token types and modifiers by index — LSP `SemanticTokensLegend`
// with a version.  `types` are the standard LSP names where one fits
// (`type`, `function`, `variable`, `parameter`, `keyword`, `number`,
// `operator`, `comment`, `enumMember`, `property`, `class`,
// `namespace`) plus `unit` and `slot`; `modifiers` are the standard
// `declaration` and `defaultLibrary` plus `source`, `output`, `device`,
// `instance`, `unresolved`.  The version moves when a name is added,
// removed or renumbered; a client colours by name, never by index, and
// leaves an unknown name plain.
message SemanticTokenLegend {
  uint32 version = 1;
  repeated string types = 2;
  repeated string modifiers = 3;
}

// One classified span, in byte offsets into the request's text.
message SemanticToken {
  uint32 start = 1;
  uint32 end = 2;
  // Index into `legend.types`.
  uint32 token_type = 3;
  // Bit set over `legend.modifiers` (bit i = modifiers[i]).
  uint32 token_modifiers = 4;
}

// The Code view's IDE queries (protocol 0.22; ADR-0035,
// `docs/architecture/ide-service.md` § Studio integration).  Each carries
// the text of one source file exactly as the client has it, like
// SemanticTokens: the daemon sets it as that file's overlay on the
// workspace and answers from the same `bdl-ide` functions the language
// server calls.  `generation` is the client's own counter, echoed, so an
// answer to an older text is dropped; `offset` is a byte offset into
// `text`.  A text that does not build still answers what the tree and
// the last build still know; nothing is guessed from a spelling.
message SourceCompletionRequest {
  uint64 revision = 1;
  uint64 generation = 2;
  string path = 3;
  string text = 4;
  uint32 offset = 5;
}

message SourceCompletionResponse {
  uint64 revision = 1;
  uint64 generation = 2;
  // In the service's order: relevance, then label.  A relationship with
  // inputs (a rule) is a call (`f(`); a Source or a value is its name; a
  // unit its symbol; an equation of the library its call.  The insertion
  // text is the service's, never composed by a client.
  repeated DraftCompletionItem items = 3;
}

// Answered by DraftHoverResponse (`mapping_id` unused; `found` false
// where nothing semantic is under the offset).
message SourceHoverRequest {
  uint64 revision = 1;
  uint64 generation = 2;
  string path = 3;
  string text = 4;
  uint32 offset = 5;
}

message SourceDefinitionRequest {
  uint64 revision = 1;
  uint64 generation = 2;
  string path = 3;
  string text = 4;
  uint32 offset = 5;
}

message SourceReferencesRequest {
  uint64 revision = 1;
  uint64 generation = 2;
  string path = 3;
  string text = 4;
  uint32 offset = 5;
  bool include_declaration = 6;
}

// Where an entity is declared or referenced, in the workspace's files —
// byte offsets into the text of `path` as the daemon holds it (the
// requested file's overlay, the other files as written back).  A body
// entity's site is in the component's authored source, never a
// flattened copy.
message SourceLocation {
  string path = 1;
  uint32 start = 2;
  uint32 end = 3;
}

message SourceLocationsResponse {
  uint64 revision = 1;
  uint64 generation = 2;
  // The name under the offset, when it resolved to an entity.
  string title = 3;
  repeated SourceLocation locations = 4;
}

// The canonical layout of a source file (`bdl_syntax::format`): the
// whole text, formatted.  `formatted` is false — and `text` is the
// request's — when the text does not parse cleanly or is already
// canonical; a client then changes nothing.
message FormatSourceRequest {
  uint64 revision = 1;
  uint64 generation = 2;
  string path = 3;
  string text = 4;
}

message FormatSourceResponse {
  uint64 revision = 1;
  uint64 generation = 2;
  bool formatted = 3;
  string text = 4;
}

message GetSystemRequest {}

message SystemResponse {
  SystemView system = 1;
}

message ApplySystemEditRequest {
  uint64 base_revision = 1;
  SystemEditOp op = 2;
}

message SystemEditApplied {
  SystemView system = 1;
  // The derived flat design at the new revision.
  ProjectProjection project = 2;
  SystemEditOutcome outcome = 3;
}

message RunSystemAnalysisRequest {}

message SystemAnalysisResponse {
  SystemAnalysisView analysis = 1;
}

enum PortKind {
  PORT_KIND_UNSPECIFIED = 0;
  PORT_KIND_REQUIRED = 1;
  PORT_KIND_PROVIDED = 2;
  PORT_KIND_PARAMETER = 3;
}

message PortView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  PortKind kind = 4;
  // The body declaration meant to realize the port (component-local id).
  // A link, not the promise: `contract` is the promise.
  uint64 decl = 5;
  PortContractView contract = 6;
}

// What a port promises, in component-local terms (protocol 0.7).  Enough
// to render "Requires Tilt", "Provides Brightness", "Updates in tick"
// without the component body.
message PortContractView {
  // Over component-local concepts.
  Signature signature = 1;
  // Display names of the signature's inputs and output, in order.
  repeated string input_names = 2;
  string output_name = 3;
  // For each signature concept: the system concept it stands for, if shared.
  repeated IdPair shared = 4;
  ClockContractKind clock_kind = 5;
  // The component-local clock, for PARAMETER and PRIVATE.
  optional uint64 clock_id = 6;
  string clock_name = 7;
  // Kernel commitment labels (empty today).
  repeated string commitments = 8;
}

enum ClockContractKind {
  CLOCK_CONTRACT_KIND_UNSPECIFIED = 0;
  CLOCK_CONTRACT_KIND_AGNOSTIC = 1;
  CLOCK_CONTRACT_KIND_PARAMETER = 2;
  CLOCK_CONTRACT_KIND_PRIVATE = 3;
}

message ComponentView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  repeated PortView ports = 4;
  // Body clock domains that are parameters (component-local ids).
  repeated uint64 clock_params = 5;
  // Body concept → system concept it stands for.
  repeated IdPair shared_concepts = 6;
  // Body sink → system sink it stands for.
  repeated IdPair external_outputs = 7;
  // The body as an ordinary design (component-local ids; no layout, no
  // session fields).
  ProjectProjection body = 8;
  // Implementation stamp: bumped by body edits only.
  uint64 stamp = 9;
  // Bumped by public-interface edits only (protocol 0.7).
  uint64 interface_stamp = 10;
}

message IdPair {
  uint64 local = 1;
  uint64 system = 2;
}

message ComponentInstanceView {
  uint64 id = 1;
  uint64 component = 2;
  string name = 3;
  // Component clock parameter → system clock domain.
  repeated IdPair clock_bindings = 4;
  repeated ParameterBindingView parameter_bindings = 5;
}

message ParameterBindingView {
  uint64 port = 1;
  string source = 2;
}

// A binding end.  Normally a port of an instance; with `base_decl` set it
// is a relationship of the system's own design instead (protocol 0.8:
// the base is the FV residual, bindable directly), and `instance`/`port`
// are unset.
message PortRefView {
  uint64 instance = 1;
  uint64 port = 2;
  optional uint64 base_decl = 3;
}

message BindingView {
  uint64 id = 1;
  PortRefView source = 2;
  PortRefView destination = 3;
  // Present when transported through `sync` from the source's domain.
  optional string transport_init = 4;
}

message ExportView {
  uint64 id = 1;
  PortRefView port = 2;
  string name = 3;
}

// Where a flat entity of the derived design came from.
message OriginView {
  // The flat id and its sort.
  uint64 flat = 1;
  LocalSort sort = 2;
  uint64 instance = 3;
  uint64 component = 4;
  // The component-local id.
  uint64 local = 5;
  // The port, when the flat declaration is one.
  optional uint64 port = 6;
}

enum LocalSort {
  LOCAL_SORT_UNSPECIFIED = 0;
  LOCAL_SORT_DECL = 1;
  LOCAL_SORT_SEM = 2;
  LOCAL_SORT_CLOCK = 3;
  LOCAL_SORT_OUTPUT = 4;
  LOCAL_SORT_DEVICE = 5;
}

message SystemView {
  uint64 revision = 1;
  string name = 2;
  // The system's own flat design (shared concepts, domains, sinks, devices,
  // top-level relationships), with base ids.
  ProjectProjection base = 3;
  repeated ComponentView components = 4;
  repeated ComponentInstanceView instances = 5;
  repeated BindingView bindings = 6;
  repeated ExportView exports = 7;
  // Provenance of the derived flat design.
  repeated OriginView origins = 8;
  // True for a system whose flattening is its base: an ordinary flat design.
  bool is_flat = 9;
  // Authoring groups over the base's relationships (protocol 0.8).
  repeated BehaviorGroupView groups = 10;
  // Bumped by every group edit; never a revision (group edits change no
  // semantic fact, so nothing revision-keyed is invalidated by them).
  uint64 authoring_generation = 11;
  // Every group's boundary at this authoring generation, read off the
  // (cached) analyses of the revision: a projection that follows the
  // membership without any re-analysis.
  repeated BehaviorGroupBoundaryView boundaries = 12;
  // Whether the authored system differs from what is saved — a group edit
  // dirties the project without moving the revision.
  bool dirty = 13;
  // The definition drafts the project holds (0.15): text typed for a
  // relationship and not committed, saved with the project and restored on
  // open.  A client seeds its editors from these when it opens the project
  // and keeps them current through AnalyzeDefinitionDraft /
  // DiscardDefinitionDraft; the daemon persists whatever it holds.
  repeated DefinitionDraftView definition_drafts = 14;
}

message DefinitionDraftView {
  // The component whose body the relationship belongs to; absent for the
  // system's own design.  Ids are then component-local.
  optional uint64 component = 1;
  uint64 mapping_id = 2;
  string source = 3;
}

// A group is authoring metadata: identity, scope, name, description,
// members.  Its scope is the authored design the members belong to: the
// system's own design, or — with `component` set — that component's body
// (members are then component-local ids).
message BehaviorGroupView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  // Relationship ids of the scope's design, in authoring order.
  repeated uint64 members = 4;
  optional uint64 component = 5;
}

// Group edits: applied outside the revision stream (no ProjectChanged, no
// AnalysisReady), answered with the SystemView at the new authoring
// generation.
message ApplyGroupEditRequest {
  GroupEditOp op = 1;
  // The authoring generation the client saw; refused with
  // `group_edit.stale_generation` if the table has moved since (so two
  // clients never silently overwrite each other's membership).
  optional uint64 base_generation = 2;
}

message GroupEditOp {
  oneof op {
    CreateGroup create_group = 1;
    RenameGroup rename_group = 2;
    SetGroupDescription set_group_description = 3;
    DeleteGroup delete_group = 4;
    AddGroupMember add_member = 5;
    RemoveGroupMember remove_member = 6;
    MoveGroupMember move_member = 7;
    MergeGroups merge_groups = 8;
    SplitGroup split_group = 9;
  }
}
message CreateGroup {
  string name = 1;
  string description = 2;
  repeated uint64 members = 3;
  // The component whose body the group organises; unset: the system's own
  // design.
  optional uint64 component = 4;
}
message RenameGroup {
  uint64 id = 1;
  string name = 2;
}
message SetGroupDescription {
  uint64 id = 1;
  string description = 2;
}
// The group goes; its relationships stay (the destructive delete is the
// system edit `delete_group_with_members`).
message DeleteGroup {
  uint64 id = 1;
}
message AddGroupMember {
  uint64 group = 1;
  uint64 decl = 2;
}
message RemoveGroupMember {
  uint64 group = 1;
  uint64 decl = 2;
}
message MoveGroupMember {
  uint64 decl = 1;
  uint64 to = 2;
}
message MergeGroups {
  uint64 into = 1;
  uint64 from = 2;
}
message SplitGroup {
  uint64 id = 1;
  string name = 2;
  repeated uint64 members = 3;
}

// The boundary of a group, read off the flat dependency graph (FV
// `Boundary`): a projection, never a declaration.  Every list holds flat
// declaration ids (base relationships keep theirs).
message BehaviorGroupBoundaryView {
  uint64 id = 1;
  repeated uint64 members = 2;
  repeated uint64 crossing_in = 3;
  repeated uint64 crossing_out = 4;
  repeated uint64 open_members = 5;
  repeated uint64 driven_members = 6;
  repeated uint64 private_candidates = 7;
  // crossing_in ++ open_members: the input socket list of a collapsed group.
  repeated uint64 external_inputs = 8;
  // crossing_out: the output socket list.
  repeated uint64 external_outputs = 9;
  repeated uint64 clocks = 10;
  repeated DeclEdge internal_edges = 11;
  // (member, crossing-in declaration): which member reads which outside
  // declaration — the concrete endpoints an aggregate input socket stands
  // for.
  repeated DeclEdge crossing_edges = 12;
}

message DeclEdge {
  uint64 from = 1;
  uint64 to = 2;
}

// "Package as reusable component": what it would do.  Nothing changes.
message PreviewComponentExtractionRequest {
  uint64 group = 1;
  ExtractionChoices choices = 2;
}

message ExtractionChoices {
  string name = 1;
  string instance_name = 2;
  // Open members to keep internal (default: every open member is an input).
  repeated uint64 keep_internal = 3;
  // Driven sinks to move into the component (default: they stay external).
  repeated uint64 internalize_sinks = 4;
}

message ExtractionPreviewResponse {
  ExtractionPreviewView preview = 1;
}

message ExtractionPreviewView {
  uint64 group = 1;
  string name = 2;
  string instance_name = 3;
  BehaviorGroupBoundaryView boundary = 4;
  repeated PreviewPortView required = 5;
  repeated PreviewPortView provided = 6;
  repeated OpenMemberDecisionView open_members = 7;
  repeated uint64 clocks = 8;
  repeated SinkDecisionView sinks = 9;
  repeated uint64 private = 10;
  repeated Diagnostic warnings = 11;
}

message PreviewPortView {
  uint64 decl = 1;
  string name = 2;
  PortKind kind = 3;
  uint64 concept = 4;
}

message OpenMemberDecisionView {
  uint64 decl = 1;
  string name = 2;
  bool as_input = 3;
}

message SinkDecisionView {
  uint64 output = 1;
  string name = 2;
  repeated uint64 drivers = 3;
  bool internal = 4;
}

message SystemEditOp {
  oneof op {
    EditOp base = 1;
    CreateComponent create_component = 2;
    RenameComponent rename_component = 3;
    SetComponentDescription set_component_description = 4;
    DeleteComponent delete_component = 5;
    EditComponentBody edit_component_body = 6;
    DeclarePort declare_port = 7;
    RenamePort rename_port = 8;
    RetirePort retire_port = 9;
    SetClockParameter set_clock_parameter = 10;
    ShareConcept share_concept = 11;
    ExternalizeOutput externalize_output = 12;
    CreateInstance create_instance = 13;
    RenameInstance rename_instance = 14;
    DeleteInstance delete_instance = 15;
    SetClockArgument set_clock_argument = 16;
    SetParameterArgument set_parameter_argument = 17;
    BindPorts bind_ports = 18;
    UnbindPorts unbind_ports = 19;
    ExportPort export_port = 20;
    HidePort hide_port = 21;
    // Contract hardening (protocol 0.7).
    ChangePortContract change_port_contract = 22;
    RebindPortDeclaration rebind_port_declaration = 23;
    DuplicateComponent duplicate_component = 24;
    ReplaceInstanceComponent replace_instance_component = 25;
    // Behaviour grouping (protocol 0.8).
    ExtractGroupAsComponent extract_group_as_component = 26;
    DeleteGroupWithMembers delete_group_with_members = 27;
  }
}

message ExtractGroupAsComponent {
  uint64 group = 1;
  ExtractionChoices choices = 2;
}
message DeleteGroupWithMembers {
  uint64 group = 1;
}

message ChangePortContract {
  uint64 component = 1;
  uint64 port = 2;
  // Only `signature`, `clock_kind`, `clock_id` and `commitments` are read.
  PortContractView contract = 3;
}
message RebindPortDeclaration {
  uint64 component = 1;
  uint64 port = 2;
  uint64 decl = 3;
}
message DuplicateComponent {
  uint64 id = 1;
  string name = 2;
}
message ReplaceInstanceComponent {
  uint64 instance = 1;
  uint64 component = 2;
}

message CreateComponent {
  string name = 1;
  string description = 2;
}
message RenameComponent {
  uint64 id = 1;
  string name = 2;
}
message SetComponentDescription {
  uint64 id = 1;
  string description = 2;
}
message DeleteComponent {
  uint64 id = 1;
}
message EditComponentBody {
  uint64 component = 1;
  EditOp op = 2;
}
message DeclarePort {
  uint64 component = 1;
  uint64 decl = 2;
  PortKind kind = 3;
  string name = 4;
  string description = 5;
}
message RenamePort {
  uint64 component = 1;
  uint64 port = 2;
  string name = 3;
}
message RetirePort {
  uint64 component = 1;
  uint64 port = 2;
}
message SetClockParameter {
  uint64 component = 1;
  uint64 clock = 2;
  bool parameter = 3;
}
message ShareConcept {
  uint64 component = 1;
  uint64 local = 2;
  optional uint64 system = 3;
}
message ExternalizeOutput {
  uint64 component = 1;
  uint64 local = 2;
  optional uint64 system = 3;
}
message CreateInstance {
  uint64 component = 1;
  string name = 2;
}
message RenameInstance {
  uint64 id = 1;
  string name = 2;
}
message DeleteInstance {
  uint64 id = 1;
}
message SetClockArgument {
  uint64 instance = 1;
  uint64 parameter = 2;
  optional uint64 clock = 3;
}
message SetParameterArgument {
  uint64 instance = 1;
  uint64 port = 2;
  optional string value = 3;
}
message BindPorts {
  PortRefView source = 1;
  PortRefView destination = 2;
  optional string transport_init = 3;
}
message UnbindPorts {
  uint64 binding = 1;
}
message ExportPort {
  PortRefView port = 1;
  string name = 2;
}
message HidePort {
  uint64 export = 1;
}

message SystemEditOutcome {
  EditKind kind = 1;
  repeated Invalidation invalidates = 2;
  // In the derived flat design's ids.
  repeated uint64 origin_decls = 3;
  repeated uint64 instances = 4;
  optional uint64 created_component = 5;
  optional uint64 created_instance = 6;
  optional uint64 created_port = 7;
  optional uint64 created_binding = 8;
  optional uint64 created_export = 9;
  // The flat outcome of a base or body edit (body ids are local).
  optional EditOutcome inner = 10;
  // Bindings whose well-formedness the edit reopens (protocol 0.7).
  repeated uint64 bindings = 11;
}

enum PortStatusKind {
  PORT_STATUS_KIND_UNSPECIFIED = 0;
  PORT_STATUS_KIND_PROVIDED = 1;
  PORT_STATUS_KIND_BOUND = 2;
  PORT_STATUS_KIND_EXPORTED = 3;
  PORT_STATUS_KIND_VALUED = 4;
  // An unbound required port: an ordinary open declaration, never an error.
  PORT_STATUS_KIND_OPEN = 5;
}

message PortStatusView {
  PortRefView port = 1;
  PortStatusKind status = 2;
  optional uint64 binding = 3;
  optional uint64 export = 4;
}

enum SystemAcceptance {
  SYSTEM_ACCEPTANCE_UNSPECIFIED = 0;
  SYSTEM_ACCEPTANCE_INVALID = 1;
  SYSTEM_ACCEPTANCE_OPEN = 2;
  SYSTEM_ACCEPTANCE_EXECUTABLE = 3;
}

// A flat diagnostic with its system origin.
message ProjectedDiagnostic {
  Diagnostic diagnostic = 1;
  optional OriginView origin = 2;
  // `instance.local` for an instance's entity, else the base entity's name.
  string label = 3;
}

message SystemAnalysisView {
  uint64 revision = 1;
  // The existing compiler's analysis of the derived flat design.
  ProjectAnalysis analysis = 2;
  // Composition-level diagnostics (`system.*`).
  repeated Diagnostic composition = 3;
  repeated PortStatusView ports = 4;
  SystemAcceptance acceptance = 5;
  // Every diagnostic, composition and flat, with its origin.
  repeated ProjectedDiagnostic projected = 6;
  // Per component: whether its body realizes its public interface.
  repeated ComponentStatusView components = 7;
  // Per group: its boundary (protocol 0.8).
  repeated BehaviorGroupBoundaryView groups = 8;
  // Per component: the compiler's analysis of its body on its own, in
  // component-local ids — the component-source view's verdicts.
  repeated ComponentAnalysisView component_analyses = 9;
}

message ComponentAnalysisView {
  uint64 id = 1;
  ProjectAnalysis analysis = 2;
}

message ComponentStatusView {
  uint64 id = 1;
  bool realizes = 2;
}
