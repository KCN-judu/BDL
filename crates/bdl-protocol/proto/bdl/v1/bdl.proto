// BDL Studio <-> bdld protocol, version 0.1.
//
// Transport-independent.  Messages are exchanged as length-prefixed frames
// (see crates/bdl-protocol/src/framing.rs); the transport is a child-process
// stdio pair in v0.1.
//
// Rules:
//   * every request carries a client-chosen `request_id`; the daemon answers
//     with exactly one Response bearing the same id;
//   * events are unsolicited and carry the project revision they describe;
//   * the client MUST discard any response/event whose revision is older
//     than the revision it already holds;
//   * Flutter never derives semantic truth from these messages — it renders
//     the projection the daemon sends.
//
// Field numbers are append-only.  Breaking changes bump `PROTOCOL_VERSION`.

syntax = "proto3";

package bdl.v1;

// ---------------------------------------------------------------------------
// Envelope
// ---------------------------------------------------------------------------

message ClientMessage {
  uint64 request_id = 1;
  oneof payload {
    HandshakeRequest handshake = 10;
    OpenProjectRequest open_project = 11;
    InitProjectRequest init_project = 12;
    SaveProjectRequest save_project = 13;
    CloseProjectRequest close_project = 14;
    GetProjectRequest get_project = 15;
    ApplyEditRequest apply_edit = 16;
    UndoRequest undo = 17;
    RedoRequest redo = 18;
    SetLayoutRequest set_layout = 19;
    SubscribeProjectRequest subscribe_project = 20;
    ShutdownRequest shutdown = 21;
    RunAnalysisRequest run_analysis = 22;
    StartSimulationRequest start_simulation = 23;
    StepSimulationRequest step_simulation = 24;
    ResetSimulationRequest reset_simulation = 25;
    ListTargetsRequest list_targets = 26;
    AnalyzeDeploymentRequest analyze_deployment = 27;
    AnalyzeDefinitionDraftRequest analyze_definition_draft = 28;
    DiscardDefinitionDraftRequest discard_definition_draft = 29;
    CompleteDefinitionDraftRequest complete_definition_draft = 30;
    HoverDefinitionDraftRequest hover_definition_draft = 31;
    HoverEntityRequest hover_entity = 32;
    ListSemanticActionsRequest list_semantic_actions = 33;
  }
}

message ServerMessage {
  oneof payload {
    Response response = 1;
    Event event = 2;
  }
}

message Response {
  uint64 request_id = 1;
  oneof payload {
    Error error = 2;
    HandshakeResponse handshake = 10;
    ProjectResponse project = 11;
    EditApplied edit_applied = 12;
    Ack ack = 13;
    AnalysisResponse analysis = 14;
    SimulationResponse simulation = 15;
    TargetsResponse targets = 16;
    DeploymentResponse deployment = 17;
    DefinitionDraftAnalysis definition_draft = 18;
    DraftCompletionResponse draft_completion = 19;
    DraftHoverResponse draft_hover = 20;
    SemanticActionsResponse semantic_actions = 21;
  }
}

message Event {
  oneof payload {
    ProjectChanged project_changed = 1;
    DaemonLog log = 2;
    // Pushed to subscribers after every committed revision, following the
    // ProjectChanged event for the same revision.
    AnalysisReady analysis_ready = 3;
  }
}

message Ack {}

// A structured failure of one request.  `code` is a stable machine-readable
// identifier (e.g. "edit.duplicate_concept_name"); `message` is designer
// readable; `details_json` carries the typed error for the expert view.
message Error {
  string code = 1;
  string message = 2;
  string details_json = 3;
}

// ---------------------------------------------------------------------------
// Handshake
// ---------------------------------------------------------------------------

message Version {
  uint32 major = 1;
  uint32 minor = 2;
  uint32 patch = 3;
}

message HandshakeRequest {
  Version client_protocol_version = 1;
  string client_name = 2;
  string client_version = 3;
}

message HandshakeResponse {
  Version protocol_version = 1;
  string compiler_version = 2;
  string daemon_name = 3;
  // True when the daemon accepts the client's protocol version.
  bool compatible = 4;
}

// ---------------------------------------------------------------------------
// Project lifecycle
// ---------------------------------------------------------------------------

message OpenProjectRequest {
  string root_path = 1;
}

message InitProjectRequest {
  string root_path = 1;
  string name = 2;
}

message SaveProjectRequest {}

message CloseProjectRequest {}

message GetProjectRequest {}

message SubscribeProjectRequest {}

message ShutdownRequest {}

message ProjectResponse {
  ProjectProjection project = 1;
}

// ---------------------------------------------------------------------------
// Edits
// ---------------------------------------------------------------------------

message ApplyEditRequest {
  // Revision the client believes it is editing.  The daemon refuses the edit
  // if the project has moved on (code "edit.stale_revision").
  uint64 base_revision = 1;
  EditOp op = 2;
}

message UndoRequest {}
message RedoRequest {}

message EditApplied {
  ProjectProjection project = 1;
  EditOutcome outcome = 2;
}

message EditOp {
  oneof op {
    CreateConcept create_concept = 1;
    RenameConcept rename_concept = 2;
    SetConceptDescription set_concept_description = 3;
    SetConceptRepresentation set_concept_representation = 4;
    DeleteConcept delete_concept = 5;
    CreateMapping create_mapping = 6;
    RenameMapping rename_mapping = 7;
    SetMappingDescription set_mapping_description = 8;
    SetMappingSignature set_mapping_signature = 9;
    AttachDefinition attach_definition = 10;
    ReplaceDefinition replace_definition = 11;
    DeleteMapping delete_mapping = 12;
    CreateClockDomain create_clock_domain = 13;
    RenameClockDomain rename_clock_domain = 14;
    DeleteClockDomain delete_clock_domain = 15;
    SetMappingClock set_mapping_clock = 16;
    CreateOutput create_output = 17;
    RenameOutput rename_output = 18;
    SetOutputAccepts set_output_accepts = 19;
    SetOutputClock set_output_clock = 20;
    SetOutputRequired set_output_required = 21;
    DeleteOutput delete_output = 22;
    SetMappingDrive set_mapping_drive = 23;
    CreateDevice create_device = 24;
    RenameDevice rename_device = 25;
    SetDeviceKind set_device_kind = 26;
    SetDeviceOutput set_device_output = 27;
    SetDevicePin set_device_pin = 28;
    DeleteDevice delete_device = 29;
  }
}

message CreateConcept {
  string name = 1;
  string description = 2;
  optional Representation representation = 3;
}
message RenameConcept {
  uint64 id = 1;
  string name = 2;
}
message SetConceptDescription {
  uint64 id = 1;
  string description = 2;
}
message SetConceptRepresentation {
  uint64 id = 1;
  optional Representation representation = 2;
}
message DeleteConcept {
  uint64 id = 1;
}
message CreateMapping {
  string name = 1;
  string description = 2;
  Signature signature = 3;
}
message RenameMapping {
  uint64 id = 1;
  string name = 2;
}
message SetMappingDescription {
  uint64 id = 1;
  string description = 2;
}
message SetMappingSignature {
  uint64 id = 1;
  Signature signature = 2;
}
message AttachDefinition {
  uint64 id = 1;
  Definition definition = 2;
}
message ReplaceDefinition {
  uint64 id = 1;
  // Absent = detach.
  optional Definition definition = 2;
}
message DeleteMapping {
  uint64 id = 1;
}
message CreateClockDomain {
  string name = 1;
}
message RenameClockDomain {
  uint64 id = 1;
  string name = 2;
}
// Refused while a mapping or an output is in the domain.
message DeleteClockDomain {
  uint64 id = 1;
}
message SetMappingClock {
  uint64 id = 1;
  optional uint64 clock_id = 2;
}
message CreateOutput {
  string name = 1;
  string description = 2;
  // The concept the sink accepts.
  uint64 accepts = 3;
  optional uint64 clock_id = 4;
}
message RenameOutput {
  uint64 id = 1;
  string name = 2;
}
message SetOutputAccepts {
  uint64 id = 1;
  uint64 accepts = 2;
}
message SetOutputClock {
  uint64 id = 1;
  optional uint64 clock_id = 2;
}
message SetOutputRequired {
  uint64 id = 1;
  bool required = 2;
}
// Refused while a mapping drives the sink or a device realises it.
message DeleteOutput {
  uint64 id = 1;
}
// Connect (or disconnect) a mapping to the output it commits to.
message SetMappingDrive {
  uint64 id = 1;
  optional uint64 output_id = 2;
}
message CreateDevice {
  string name = 1;
  DeviceKind kind = 2;
  optional uint64 output_id = 3;
}
message RenameDevice {
  uint64 id = 1;
  string name = 2;
}
message SetDeviceKind {
  uint64 id = 1;
  DeviceKind kind = 2;
}
message SetDeviceOutput {
  uint64 id = 1;
  optional uint64 output_id = 2;
}
// Pin one of the device's requirements (by its index in the kind's list)
// to a named board resource, or release it.
message SetDevicePin {
  uint64 id = 1;
  uint32 index = 2;
  optional string resource = 3;
}
message DeleteDevice {
  uint64 id = 1;
}

// What a device binding needs from the board is derived from its kind
// (docs/HARDWARE_MODEL.md); the kind is the whole of what the surface says.
enum DeviceKind {
  DEVICE_KIND_UNSPECIFIED = 0;
  DEVICE_KIND_PWM_CHANNEL = 1;
  DEVICE_KIND_DIGITAL_OUTPUT = 2;
  DEVICE_KIND_H_BRIDGE_CHANNEL = 3;
  DEVICE_KIND_I2C_SENSOR = 4;
  DEVICE_KIND_QUADRATURE_ENCODER = 5;
  DEVICE_KIND_UART = 6;
}

enum EditKind {
  EDIT_KIND_UNSPECIFIED = 0;
  EDIT_KIND_REFINEMENT = 1;
  EDIT_KIND_EDIT = 2;
}

enum Invalidation {
  INVALIDATION_UNSPECIFIED = 0;
  INVALIDATION_INTERFACE = 1;
  INVALIDATION_REALIZATION = 2;
  INVALIDATION_SEMANTIC = 3;
  INVALIDATION_REACTIVE = 4;
  INVALIDATION_CLOCK = 5;
  INVALIDATION_OUTPUT = 6;
  INVALIDATION_DEPLOYMENT = 7;
}

message EditOutcome {
  EditKind kind = 1;
  repeated Invalidation invalidates = 2;
  repeated uint64 origin_decls = 3;
  optional uint64 created_concept = 4;
  optional uint64 created_mapping = 5;
  optional uint64 created_clock = 6;
  optional uint64 created_output = 7;
  optional uint64 created_device = 8;
}

// ---------------------------------------------------------------------------
// Project projection (read model for rendering)
// ---------------------------------------------------------------------------

message ProjectProjection {
  uint64 revision = 1;
  string name = 2;
  string root_path = 3;
  repeated ConceptView concepts = 4;
  repeated MappingView mappings = 5;
  Layout layout = 6;
  bool can_undo = 7;
  bool can_redo = 8;
  bool dirty = 9;
  repeated ClockView clocks = 10;
  repeated OutputView outputs = 11;
  repeated DeviceView devices = 12;
}

message ClockView {
  uint64 id = 1;
  string name = 2;
}

message OutputView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  uint64 accepts = 4;
  optional uint64 clock_id = 5;
  bool required = 6;
}

message DeviceView {
  uint64 id = 1;
  string name = 2;
  DeviceKind kind = 3;
  optional uint64 output_id = 4;
  // Manual pin choices by requirement index.
  repeated DevicePin fixed_pins = 5;
  // The requirements this kind implies, for the editor's pin table.
  repeated RequirementLabel requirements = 6;
}

message DevicePin {
  uint32 index = 1;
  string resource = 2;
}

message RequirementLabel {
  uint32 index = 1;
  // Capability name, e.g. "pwm", "digital_out", "i2c_sda".
  string capability = 2;
  string label = 3;
}

message ConceptView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  optional Representation representation = 4;
}

message MappingView {
  uint64 id = 1;
  string name = 2;
  string description = 3;
  Signature signature = 4;
  optional Definition definition = 5;
  AcceptanceState state = 6;
  optional uint64 clock_id = 7;
  optional uint64 drives_output_id = 8;
}

// The workspace states of the paper's interaction model.  Only the first two
// are produced before the checker exists; the rest are reserved.
enum AcceptanceState {
  ACCEPTANCE_STATE_UNSPECIFIED = 0;
  ACCEPTANCE_STATE_DECLARED = 1;
  ACCEPTANCE_STATE_DEFINED = 2;
  ACCEPTANCE_STATE_TYPE_VALID = 3;
  ACCEPTANCE_STATE_TEMPORALLY_VALID = 4;
  ACCEPTANCE_STATE_CLOCK_CONSISTENT = 5;
  ACCEPTANCE_STATE_OUTPUT_COMPLETE = 6;
  ACCEPTANCE_STATE_HARDWARE_FEASIBLE = 7;
}

message Signature {
  repeated uint64 inputs = 1;
  uint64 output = 2;
}

message Definition {
  oneof kind {
    string formula = 1;
  }
}

message Representation {
  oneof kind {
    Dim quantity = 1;
    Unit boolean = 2;
    Unit count = 3;
  }
}

message Unit {}

message Dim {
  sint32 length = 1;
  sint32 mass = 2;
  sint32 time = 3;
  sint32 current = 4;
  sint32 temperature = 5;
  sint32 amount = 6;
  sint32 luminous = 7;
  sint32 angle = 8;
}

// ---------------------------------------------------------------------------
// Layout (not semantics)
// ---------------------------------------------------------------------------

message Layout {
  repeated NodePosition concepts = 1;
  repeated NodePosition mappings = 2;
  repeated NodePosition outputs = 3;
}

message NodePosition {
  uint64 id = 1;
  double x = 2;
  double y = 3;
}

message SetLayoutRequest {
  Layout layout = 1;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// Sent to subscribers after every committed revision.  v0.1 sends the full
// projection; deltas are a planned protocol change (docs/PROTOCOL.md).
message ProjectChanged {
  ProjectProjection project = 1;
  optional EditOutcome outcome = 2;
}

message DaemonLog {
  string level = 1;
  string message = 2;
}

// ---------------------------------------------------------------------------
// Simulation (the reference evaluator, driven tick by tick)
// ---------------------------------------------------------------------------

// A runtime value in the design's own terms.
message Value {
  oneof kind {
    bool boolean = 1;
    uint64 count = 2;
    Quantity quantity = 3;
    SemanticValue semantic = 4;
    Unit none = 5;
    Value some = 6;
    // A function or partially applied primitive: shown, never transported.
    string opaque = 7;
  }
}

message Quantity {
  Dim dim = 1;
  double value = 2;
}

message SemanticValue {
  uint64 concept_id = 1;
  Value repr = 2;
}

// One value for an unresolved declaration at one tick.
message SimulationInput {
  uint64 mapping_id = 1;
  uint64 tick = 2;
  Value value = 3;
}

// Which domains activate: period 1 = every tick.  Domains not listed never
// activate; an empty schedule means every domain every tick.
message SchedulePeriod {
  uint64 clock_id = 1;
  uint64 period = 2;
}

// Starts a run against the *current* revision; refused if the design is
// not causal.  Inputs may be extended by later StartSimulation calls only by
// restarting.
message StartSimulationRequest {
  repeated SimulationInput inputs = 1;
  repeated SchedulePeriod schedule = 2;
}

message StepSimulationRequest {
  // Ticks to evaluate; the response carries their samples.
  uint64 ticks = 1;
}

message ResetSimulationRequest {}

message SimulationResponse {
  // The project revision the simulation runs against.
  uint64 revision = 1;
  // Next tick to be evaluated.
  uint64 next_tick = 2;
  // Samples produced by this request (all ticks so far for Start/Reset).
  repeated TickSample samples = 3;
  // Set when a tick could not be evaluated (missing input, division by zero…).
  optional Diagnostic error = 4;
}

message TickSample {
  uint64 tick = 1;
  repeated uint64 active_clock_ids = 2;
  repeated DeclarationSample values = 3;
}

message DeclarationSample {
  uint64 mapping_id = 1;
  Value value = 2;
  // Rendered in the design's terms, e.g. "Brightness(0.5)".
  string rendered = 3;
}

// ---------------------------------------------------------------------------
// Analysis (compiler results, revision-tagged; discard when stale)
// ---------------------------------------------------------------------------

message RunAnalysisRequest {}

message AnalysisResponse {
  ProjectAnalysis analysis = 1;
}

message AnalysisReady {
  ProjectAnalysis analysis = 1;
}

message ProjectAnalysis {
  // The revision the analysis was computed for.
  uint64 revision = 1;
  repeated MappingAnalysis mappings = 2;
  // Every diagnostic, in the documented stable order (entity, span, code).
  repeated Diagnostic diagnostics = 3;
  // Whole-design verdicts of the reactive passes.
  bool causal = 4;
  bool clock_consistent = 5;
  // Instantaneous cycles, each as the mapping ids involved.
  repeated DeclarationCycle cycles = 6;
  // Evaluation order the causality pass produced (empty when not causal).
  repeated uint64 evaluation_order = 7;
  // Output pass: every sink with a domain and where it stands.
  repeated OutputAnalysis outputs = 8;
  // Surface outputs still without a domain (neither driven nor missing).
  repeated uint64 open_outputs = 9;
  // Every drive edge well formed, one driver per sink, every required
  // sink driven, no output open.
  bool output_complete = 10;
}

enum OutputState {
  OUTPUT_STATE_UNSPECIFIED = 0;
  OUTPUT_STATE_UNDRIVEN = 1;
  OUTPUT_STATE_DRIVEN = 2;
  OUTPUT_STATE_ILL_FORMED = 3;
  OUTPUT_STATE_CONFLICT = 4;
}

message OutputAnalysis {
  uint64 id = 1;
  OutputState state = 2;
  // The single well-formed driver, when driven.
  optional uint64 driver = 3;
  // Every mapping that claims the sink (well formed or not).
  repeated uint64 claimants = 4;
}

message DeclarationCycle {
  repeated uint64 mapping_ids = 1;
}

enum MappingStatus {
  MAPPING_STATUS_UNSPECIFIED = 0;
  // Named and typed; no definition.
  MAPPING_STATUS_DECLARED = 1;
  // Defined, but something it needs is still open (not an error).
  MAPPING_STATUS_OPEN = 2;
  // Defined and does not check.
  MAPPING_STATUS_INVALID = 3;
  // Defined and produces what the signature promises.
  MAPPING_STATUS_TYPE_VALID = 4;
  // Type-valid and on no instantaneous loop: has a value at every activation.
  MAPPING_STATUS_TEMPORALLY_VALID = 5;
  // Temporally valid and every read stays in its domain or is transported.
  MAPPING_STATUS_CLOCK_CONSISTENT = 6;
}

message MappingAnalysis {
  uint64 id = 1;
  MappingStatus status = 2;
  // Kernel notation, for the explanation view only.
  string interface = 3;
  string inferred_type = 4;
  string core_expr = 5;
  repeated Diagnostic diagnostics = 6;
}

enum DiagnosticSeverity {
  DIAGNOSTIC_SEVERITY_UNSPECIFIED = 0;
  DIAGNOSTIC_SEVERITY_ERROR = 1;
  DIAGNOSTIC_SEVERITY_WARNING = 2;
  DIAGNOSTIC_SEVERITY_INFO = 3;
}

message SourceSpan {
  uint32 start = 1;
  uint32 end = 2;
}

message Diagnostic {
  string code = 1;
  DiagnosticSeverity severity = 2;
  oneof entity {
    Unit project = 3;
    uint64 concept_id = 4;
    uint64 mapping_id = 5;
  }
  optional SourceSpan span = 6;
  string message = 7;
  string explanation = 8;
  string technical = 9;
  repeated string fixes = 10;
}

// ---------------------------------------------------------------------------
// Definition drafts (read-only: a candidate definition checked, not committed)
// ---------------------------------------------------------------------------

// Analyse `source` as if it were the definition of `mapping_id` at
// `revision`, without committing anything.  Refused with
// `draft.stale_revision` if the project has moved on and
// `draft.unknown_mapping` if the mapping does not exist at that revision.
// `generation` is a client-chosen tag echoed back unchanged so the client
// can drop responses that a newer draft has superseded.
message AnalyzeDefinitionDraftRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  uint64 generation = 3;
  string source = 4;
}

message DefinitionDraftAnalysis {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  uint64 generation = 3;
  // False when the source did not parse; the diagnostics say where.
  bool parse_ok = 4;
  // The same verdict a committed definition gets; diagnostic spans index
  // the draft source of the request, not any committed source.
  MappingAnalysis analysis = 5;
}

// The draft is gone (revert, reload, detach): the mapping's effective
// definition is the committed one again for every later query, on every
// surface.  Ack, also when there was no draft.
message DiscardDefinitionDraftRequest {
  uint64 mapping_id = 1;
}

// Completion inside the draft at a byte `offset` into `source`.  Sets the
// draft overlay to `source` first (so the candidates are for exactly this
// text), then asks the IDE service.  Same refusals as
// AnalyzeDefinitionDraft; an empty list is a normal answer.
message CompleteDefinitionDraftRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  uint32 offset = 4;
}

message DraftCompletionResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  repeated DraftCompletionItem items = 3;
}

message DraftCompletionItem {
  string label = 1;
  // "input", "unit", "keyword", "concept", "representation", "mapping".
  string kind = 2;
  // Replace the byte range [replace_start, replace_end) of the source
  // with `insert`.
  uint32 replace_start = 3;
  uint32 replace_end = 4;
  string insert = 5;
  // Product-language type of the completed expression, when known.
  string resulting_type = 6;
  string documentation = 7;
  uint32 relevance = 8;
}

// The concept under a byte `offset` into the draft `source`, as the IDE
// service explains it.  `found` is false when nothing semantic is there.
message HoverDefinitionDraftRequest {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  string source = 3;
  uint32 offset = 4;
}

message DraftHoverResponse {
  uint64 revision = 1;
  uint64 mapping_id = 2;
  bool found = 3;
  // The byte range of the name under the cursor.
  optional SourceSpan span = 4;
  optional uint64 concept_id = 5;
  string title = 6;
  string representation = 7;
  // "declared", "open", "defined", … (bdl-ide EntityStatus, product words).
  string status = 8;
  repeated HoverDetail details = 9;
  string explanation = 10;
  // Set by HoverEntity for entities other than concepts.
  optional EntityRef entity = 11;
  // The surface signature (`dimByTilt : Tilt -> Brightness`), when the
  // entity has one.
  string signature = 12;
  // Whether the status is one of the open (undecided) states rather than
  // a settled or a wrong one.
  bool open = 13;
}

// A stable entity of the design, by identity (never by name).
message EntityRef {
  oneof kind {
    Unit project = 1;
    uint64 concept_id = 2;
    uint64 mapping_id = 3;
    uint64 clock_id = 4;
    uint64 output_id = 5;
    uint64 device_id = 6;
  }
}

// The everyday hover card for any entity (a canvas node, a library row):
// the same DraftHoverResponse as a formula hover, with `entity` set.
// `found` is false when the entity does not exist at `revision`.
message HoverEntityRequest {
  uint64 revision = 1;
  EntityRef entity = 2;
}

// ---------------------------------------------------------------------------
// Semantic actions (bdl-ide: explicit, meaning-changing fixes, never silent)
// ---------------------------------------------------------------------------

// The actions bdl-ide offers for an entity: the fixes for its diagnostics
// plus its context actions.  Read-only; applying one is an ordinary
// ApplyEdit of the plan's edits, sent by the client against the revision
// it holds.
message ListSemanticActionsRequest {
  uint64 revision = 1;
  EntityRef entity = 2;
}

message SemanticActionsResponse {
  uint64 revision = 1;
  EntityRef entity = 2;
  repeated SemanticActionView actions = 3;
}

enum ActionApplicability {
  ACTION_APPLICABILITY_UNSPECIFIED = 0;
  // `edits` can be applied as they are.
  ACTION_APPLICABILITY_READY = 1;
  // The designer picks one of `options`; the tool never guesses.
  ACTION_APPLICABILITY_NEEDS_CHOICE = 2;
  // The language cannot express the fix yet; `reason` says why.
  ACTION_APPLICABILITY_BLOCKED = 3;
}

message SemanticActionView {
  string id = 1;
  string title = 2;
  // "quick_fix" or "refactor".
  string kind = 3;
  ActionApplicability applicability = 4;
  string reason = 5;
  repeated ActionChoiceView options = 6;
  string explanation = 7;
  // The model edits of a ready plan, in order.  Text/draft edits of a
  // plan are not carried here (the LSP applies those).
  repeated EditOp edits = 8;
  // Diagnostic codes the action addresses.
  repeated string addresses = 9;
  // Product-language summary of what the plan would reopen.
  string invalidation = 10;
}

message ActionChoiceView {
  string label = 1;
  EditOp edit = 2;
}

message HoverDetail {
  string label = 1;
  string value = 2;
}

// ---------------------------------------------------------------------------
// Deployment (target-relative; never part of the semantic analysis)
// ---------------------------------------------------------------------------

message ListTargetsRequest {}

message TargetsResponse {
  repeated TargetView targets = 1;
}

message TargetView {
  // Registry id, e.g. "arduino_nano".
  string id = 1;
  string name = 2;
  uint32 resource_count = 3;
}

message AnalyzeDeploymentRequest {
  string target_id = 1;
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_FEASIBLE = 1;
  DEPLOYMENT_STATUS_INFEASIBLE = 2;
  // Placement succeeds but an output has no device, or a device no output.
  DEPLOYMENT_STATUS_INCOMPLETE = 3;
}

message DeploymentResponse {
  DeploymentAnalysis deployment = 1;
}

message DeploymentAnalysis {
  uint64 revision = 1;
  string target = 2;
  DeploymentStatus status = 3;
  repeated RequirementView requirements = 4;
  // The witness, when feasible: one placement per requirement.
  repeated Placement assignment = 5;
  optional DeadEnd dead_end = 6;
  repeated uint64 unbound_devices = 7;
  repeated uint64 unrealised_outputs = 8;
  repeated Diagnostic diagnostics = 9;
}

message RequirementView {
  uint64 device_id = 1;
  uint32 index = 2;
  string capability = 3;
  optional string fixed = 4;
  string label = 5;
}

message Placement {
  uint64 device_id = 1;
  uint32 index = 2;
  string resource = 3;
}

// One explanation of infeasibility: the first requirement greedy placement
// could not place, and what blocked each candidate.  Not a minimal core.
message DeadEnd {
  uint64 device_id = 1;
  uint32 index = 2;
  oneof reason {
    Unit no_capable_resource = 3;
    string fixed_unavailable = 4;
    BlockedCandidates blocked = 5;
  }
  repeated Placement placed = 6;
}

message BlockedCandidates {
  repeated BlockedCandidate candidates = 1;
}

message BlockedCandidate {
  string resource = 1;
  uint64 held_by_device_id = 2;
  uint32 held_by_index = 3;
}
