name = "rp2040_pico"
display_name = "Raspberry Pi Pico (RP2040)"
description = "RP2040: 27 GPIO lines, PWM on every line but the LED over eight slices, ADC on GP26–GP28, two I²C, two UART, two SPI; GP25 is the on-board LED"
family = "rp2040"
shareable = [
    "i2c_sda",
    "i2c_scl",
]

